          ui.libStats.textContent = `${plural(clips.length, "clip")} · ${fmtLen(total)} · ${words.toLocaleString()} words`;
          ui.hideSilentWrap.hidden = silent === 0;
          ui.hideSilentWrap.lastChild.textContent = ` Hide no speech (${silent})`;
        }

        // ---- Search -------------------------------------------------------------------------
        function runSearch() {
          const q = ui.search.value.trim().split(/\s+/).map(normWord).filter(Boolean);
          hits = [];
          hitIndex = -1;
          if (q.length) {
            outer: for (const clip of clips) {
              const w = clip.words;
              for (let i = 0; i + q.length <= w.length; i++) {
                let ok = true;
                for (let k = 0; k < q.length; k++) {
                  const n = w[i + k].n;
                  // Whole words, except the last query word, which may be the start of a word (typing ahead).
                  if (k === q.length - 1 ? !n.startsWith(q[k]) : n !== q[k]) {
                    ok = false;
                    break;
                  }
                }
                if (ok) {
                  hits.push({ c: clip.index, a: i, b: i + q.length - 1 });
                  if (hits.length >= MAX_RESULTS) break outer;
                }
              }
            }
          }
          renderLibrary();
          renderWords();
        }

        function renderResults() {
          const list = ui.libList;
          list.replaceChildren();
          ui.searchMeta.hidden = false;
          const n = hits.length;
          ui.searchMeta.replaceChildren(
            el(
              "span",
              null,
              n >= MAX_RESULTS ? `${MAX_RESULTS}+ matches` : plural(n, "match", "matches"),
            ),
            el("span", null, n ? "↑↓ move · ↵ select · Esc clear" : "Esc clear"),
          );
          if (!n) {
            list.append(
              el(
                "div",
                "empty",
                "No word matches. Search finds whole words; the last one may be partial.",
              ),
            );
            return;
          }
          hits.forEach((h, k) => {
            const clip = clips[h.c];
            const row = el("button", "result");
            row.type = "button";
            row.dataset.k = String(k);
            row.setAttribute("aria-selected", String(k === hitIndex));
            const head = el("div", "result-head");
            head.append(el("span", null, clip.label), el("span", "mono", fmtT(clip.words[h.a].s)));
            const text = el("div");
            const from = Math.max(0, h.a - 5);
            const to = Math.min(clip.words.length - 1, h.b + 6);
            if (from > 0) text.append("… ");
            for (let i = from; i <= to; i++) {
              const t = clip.words[i].t;
              text.append(i >= h.a && i <= h.b ? el("mark", null, t) : t, i < to ? " " : "");
            }
            if (to < clip.words.length - 1) text.append(" …");
            row.append(head, text);
            list.append(row);
          });
        }

        function goToHit(k) {
          if (!hits.length) return;
          hitIndex = clamp(k, 0, hits.length - 1);
          const h = hits[hitIndex];
          setSelection(h.c, h.a, h.b);
          anchor = { c: h.c, i: h.a };
          scrollWordIntoView(h.c, h.a, true);
          for (const r of ui.libList.querySelectorAll(".result"))
            r.setAttribute("aria-selected", String(Number(r.dataset.k) === hitIndex));
          ui.libList
            .querySelector(`.result[data-k="${hitIndex}"]`)
            ?.scrollIntoView({ block: "nearest" });
          renderLibraryCurrent();
        }

        function renderLibraryCurrent() {
          for (const r of ui.libList.querySelectorAll(".clip-row"))
            r.setAttribute("aria-current", String(Number(r.dataset.c) === cursor.c));
        }

        // ---- Picks list, strip and meter (right) ----------------------------------------------
        const SVG = {
          left: "M10.5 3v10L5 8z",
          right: "M5.5 3v10L11 8z",
          check: "M6.2 11.6 2.8 8.2l1-1 2.4 2.4 6-6 1 1z",
          close: "M4.2 3.2 8 7l3.8-3.8 1 1L9 8l3.8 3.8-1 1L8 9l-3.8 3.8-1-1L7 8 3.2 4.2z",
          up: "M8 4l5 6H3z",
          down: "M8 12 3 6h10z",
        };
        function iconButton(path, title, onClick) {
          const b = el("button", "iconbtn");
          b.type = "button";
          b.title = title;
          b.setAttribute("aria-label", title);
          b.innerHTML = `<svg viewBox="0 0 16 16"><path d="${path}"/></svg>`;
          b.addEventListener("click", (e) => {
            e.stopPropagation();
            onClick();
          });
          return b;
        }

        function renderPicks() {
          const panel = ui.picksPanel;
          const keepScroll = panel.scrollTop;
          panel.replaceChildren();
          const nPicks = picks().length;
          const nPending = pendingSuggestions().length;
          ui.pickCount.textContent = nPending
            ? `${nPicks} picked · ${nPending} suggested`
            : plural(nPicks, "pick");
          if (!seq.length) {
            panel.append(
              el(
                "div",
                "empty",
                "Nothing picked yet. Select words in the transcript and press Enter, or press S then Enter to pick a sentence.",
              ),
            );
            return;
          }
          let n = 0;
          for (const x of seq) {
            const id = entryId(x);
            const r = entryRange(x);
            const clip = clips[r.c];
            const t = pickTimes(r);
            const row = el("div", isPick(x) ? "entry" : "entry sugg");
            row.dataset.id = id;
            row.setAttribute("aria-selected", String(id === selId));
            const grip = el("div", "grip");
            grip.title = "Drag to reorder (Alt+↑/↓)";
            const numEl = el("div", "num", isPick(x) ? String(++n) : "·");
            const main = el("div", "entry-main");
            const head = el("div", "entry-head");
            head.append(el("span", "clip-name", clip.label), el("span", "mono", fmtT(t.in)));
            if (!isPick(x)) head.append(el("span", "tag sugg", "Suggested"));
            else if (x.sg) {
              const st = suggestionStatus(suggById.get(x.sg));
              head.append(
                el(
                  "span",
                  `tag ${st === "taken" ? "taken" : "changed"}`,
                  st === "taken" ? `From ${x.sg}` : `${x.sg} changed`,
                ),
              );
            }
            const text = el("div", "entry-text", textOf(r.c, r.a, r.b));
            main.append(head, text);
            const note = isPick(x) ? x.note : suggById.get(x.sid).note;
            if (note && id !== selId) main.append(el("div", "entry-note", note));
            const dur = el("div", "entry-dur", `${(t.out - t.in).toFixed(1)} s`);
            row.append(grip, numEl, main, dur);
            if (id === selId) row.append(entryTools(x));
            panel.append(row);
          }
          panel.scrollTop = keepScroll;
        }

        // Tools of the selected entry: a suggestion's accept and reject; a pick's word nudges, handles, note, delete.
        function entryTools(x) {
          const tools = el("div", "entry-tools");
          if (!isPick(x)) {
            const s = suggById.get(x.sid);
            if (s.note) tools.append(el("div", "entry-note", s.note));
            const acc = el("button", "btn sm suggest");
            acc.type = "button";
            acc.innerHTML = "Accept <kbd>A</kbd>";
            acc.addEventListener("click", (e) => {
              e.stopPropagation();
              cmdAccept();
            });
            const rej = el("button", "btn sm");
            rej.type = "button";
            rej.innerHTML = "Reject <kbd>X</kbd>";
            rej.addEventListener("click", (e) => {
              e.stopPropagation();
              cmdReject();
            });
            tools.append(acc, rej);
            return tools;
          }
          const start = el("span", "grp", "Start ");
          start.append(
            iconButton(SVG.left, "Start one word earlier ([)", () => cmdNudge("start", -1)),
            iconButton(SVG.right, "Start one word later ({)", () => cmdNudge("start", 1)),
          );
          const end = el("span", "grp", "End ");
          end.append(
            iconButton(SVG.left, "End one word earlier (})", () => cmdNudge("end", -1)),
            iconButton(SVG.right, "End one word later (])", () => cmdNudge("end", 1)),
          );
          const pad = el("span", "grp", "Handles ");
          pad.title =
            "Extra seconds before the first word and after the last (stops at the neighbouring words)";
          pad.append(
            padInput(x, "pi", "Handle before, seconds"),
            padInput(x, "po", "Handle after, seconds"),
          );
          const del = iconButton(SVG.close, "Delete this pick (Backspace)", () =>
            cmdDeleteEntry(x),
          );
          const note = document.createElement("textarea");
          note.placeholder = "Note (why this pick, what to fix)…";
          note.value = x.note ?? "";
          note.setAttribute("aria-label", "Pick note");
          note.addEventListener("click", (e) => e.stopPropagation());
          note.addEventListener("change", () => {
            if (note.value === (x.note ?? "")) return;
            x.note = note.value;
            afterEdit(`Note on pick ${pickNumber(x)}`);
          });
          tools.append(start, end, pad, el("span", "spacer"), del, note);
          return tools;
        }

        function padInput(x, key, label) {
          const input = document.createElement("input");
          input.type = "number";
          input.min = "0";
          input.max = String(MAX_PAD);
          input.step = "0.05";
          input.value = String(x[key] ?? opts.padding);
          input.title = label;
          input.setAttribute("aria-label", label);
          input.addEventListener("click", (e) => e.stopPropagation());
          input.addEventListener("change", () => {
            const v = Number(input.value);
            if (!(isNum(v) && v >= 0 && v <= MAX_PAD)) {
              input.value = String(x[key] ?? opts.padding);
              return say(`Handles are 0 to ${MAX_PAD} s`);
            }
            x[key] = r3(v);
            afterEdit(`${key === "pi" ? "Handle before" : "Handle after"} ${num(v)} s`);
          });
          return input;
        }

        function renderStrip() {
          const strip = ui.strip;
          strip.replaceChildren();
          const total = programDuration();
          if (!program.length) {
            strip.append(el("span", "strip-empty", "The cut is empty"));
            return;
          }
          const colors = [
            "--chart-1",
            "--chart-2",
            "--chart-3",
            "--chart-4",
            "--chart-5",
            "--chart-6",
          ];
          program.forEach((item, k) => {
            const b = el("div", "blk", String(k + 1));
            b.style.flex = `${item.dur} 0 0`;
            const clip = clips[item.entry.c];
            b.style.background = `color-mix(in srgb, var(${colors[clip.index % colors.length]}) 38%, var(--card))`;
            if (!clip.media) b.classList.add("nomedia");
            b.setAttribute("aria-current", String(item.entry.id === selId));
            b.title = `${k + 1}. ${clip.label} ${fmtT(item.in)}–${fmtT(item.out)} · ${item.dur.toFixed(1)} s\n${clipText(item.entry.c, item.entry.a, item.entry.b, 12)}`;
            strip.append(b);
          });
          ui.playhead = el("div", "playhead");
          strip.append(ui.playhead);
          movePlayhead(mode === "program" ? player.time() : 0, total);
        }

        function movePlayhead(t, total = programDuration()) {
          if (!ui.playhead) return;
          ui.playhead.hidden = mode !== "program" || !total;
          ui.playhead.style.left = `${total ? (100 * clamp(t, 0, total)) / total : 0}%`;
        }

        function renderMeter() {
          const total = programDuration();
          const pend = pendingDuration();
          const target = opts.targetSeconds;
          const m = ui.meter;
          m.replaceChildren();
          const row = el("div", "meter-row");
          row.append(el("span", "label", "Length"), el("span", "big", fmtLen(total)));
          if (target > 0) {
            row.append(el("span", "muted", `of ${fmtLen(target)} target`));
            const d = total - target;
            const tol = Math.max(5, target * 0.1);
            const cls = Math.abs(d) <= tol ? "ok" : d > 0 ? "over" : "under";
            row.append(el("span", `delta ${cls}`, Math.abs(d) < 0.5 ? "on target" : fmtDelta(d)));
          }
          if (pend > 0)
            row.append(el("span", "grow"), el("span", "muted", `+${fmtLen(pend)} suggested`));
          const scale = Math.max(total + pend, target * 1.15, 1);
          const bar = el("div", "bar");
          const fill = el(
            "i",
            `fill${target > 0 && total > target + Math.max(5, target * 0.1) ? " over" : ""}`,
          );
          fill.style.width = `${(100 * total) / scale}%`;
          bar.append(fill);
          if (pend > 0) {
            const g = el("i", "ghost");
            g.style.left = `${(100 * total) / scale}%`;
            g.style.width = `${(100 * pend) / scale}%`;
            bar.append(g);
          }
          if (target > 0) {
            const t = el("i", "target");
            t.style.left = `${(100 * target) / scale}%`;
            t.title = `Target ${fmtLen(target)}`;
            bar.append(t);
          }
          m.append(row, bar);
        }

        // ---- Monitor (program / source) --------------------------------------------------------
        function mediaMap() {
          return Object.fromEntries(clips.filter((c) => c.media).map((c) => [c.media, c.url]));
        }

        function programValue() {
          return {
            tracks: [
              {
                id: "V1",
                kind: "video",
                clips: program
                  .filter((x) => clips[x.entry.c].media)
                  .map((x) => ({
                    id: x.entry.id,
                    src: clips[x.entry.c].media,
                    in: x.in,
                    out: x.out,
                    start: x.start,
                  })),
              },
            ],
          };
        }

        function sourceValue(c) {
          const clip = clips[c];
          return [{ id: "source", src: clip.media, in: 0, out: clip.duration, start: 0 }];
        }

        // Re-sequences the player when the cut changed (only in Program); keeps the playhead.
        async function syncPlayer() {
          if (mode !== "program") return;
          const key = JSON.stringify(programValue());
          if (key === programKey) return;
          programKey = key;
          const t = Math.min(player.time(), programDuration());
          await player.set({ value: programValue(), time: t });
          updateMonitorNote(t);
        }

        async function setMode(next, { c, time, play } = {}) {
          if (next === "source") {
            const clip = clips[c ?? cursor.c];
            if (!clip) return;
            if (!clip.media) {
              say(`${clip.label} has no media attached, so it cannot play`);
              return;
            }
            const switching = mode !== "source" || sourceClip !== clip.index;
            mode = "source";
            sourceClip = clip.index;
            programKey = "";
            if (switching)
              await player.set({ value: sourceValue(clip.index), time: time ?? 0, playing: false });
            else await player.seek(time ?? player.time());
          } else {
            const was = mode;
            mode = "program";
            if (was !== "program") {
              programKey = JSON.stringify(programValue());
              await player.set({ value: programValue(), time: time ?? 0, playing: false });
            } else if (time !== undefined) await player.seek(time);
          }
          renderMode();
          if (play) await player.play();
        }

        function renderMode() {
          ui.modeProgram.setAttribute("aria-pressed", String(mode === "program"));
          ui.modeSource.setAttribute("aria-pressed", String(mode === "source"));
          ui.modeTag.textContent =
            mode === "program"
              ? `Program · ${plural(program.length, "pick")}`
              : `Source · ${clips[sourceClip].label}`;
          movePlayhead(mode === "program" ? player.time() : 0);
          updateMonitorNote(player.time());
          if (api) rt.syncChrome();
        }

        function updateMonitorNote(t) {
          let text = "";
          if (mode === "program") {
            if (!program.length)
              text = pendingSuggestions().length
                ? "Nothing picked yet. Accept suggestions (A, or Shift+A for all) or select words and press Enter."
                : "Nothing picked yet. Select words in the transcript and press Enter.";
            else {
              const item = programAt(t);
              if (item && !clips[item.entry.c].media)
                text = `${clips[item.entry.c].label}: media not attached`;
            }
          }
          ui.monitorNote.hidden = !text;
          ui.monitorNoteText.textContent = text;
        }

        function programAt(t) {
          for (const x of program) if (t >= x.start - 1e-3 && t < x.start + x.dur - 1e-3) return x;
          return program.length && t >= programDuration() - 1e-3
            ? program[program.length - 1]
            : null;
        }

        // The word under a source time, by binary search.
        function wordAt(clip, t) {
          const w = clip.words;
          let lo = 0;
          let hi = w.length - 1;
          let hit = -1;
          while (lo <= hi) {
            const mid = (lo + hi) >> 1;
            if (w[mid].s <= t + 1e-3) {
              hit = mid;
              lo = mid + 1;
            } else hi = mid - 1;
          }
          return hit >= 0 && t <= w[hit].e + 0.15 ? hit : -1;
        }

        function onTime({ time, duration, playing }) {
          const total = mode === "program" ? programDuration() : duration;
          ui.ptc.textContent = `${fmtT(time)} / ${fmtT(total)}`;
          ui.tc.textContent = `${fmtT(mode === "program" ? time : programDuration() ? player.time() : 0)} / ${fmtT(programDuration())}`;
          ui.playIcon.setAttribute("d", playing ? ICON_PAUSE : ICON_PLAY);
          let now = null;
          if (mode === "program") {
            movePlayhead(time);
            const item = programAt(time);
            if (item) {
              const i = wordAt(clips[item.entry.c], item.in + (time - item.start));
              if (i >= item.entry.a && i <= item.entry.b) now = { c: item.entry.c, i };
            }
            updateMonitorNote(time);
            if (api) rt.setPreviewTime(time, previewInfo(item));
          } else if (sourceClip >= 0) {
            const i = wordAt(clips[sourceClip], time);
            if (i >= 0) now = { c: sourceClip, i };
          }
          if (
            (now && (!nowWord || now.c !== nowWord.c || now.i !== nowWord.i)) ||
            (!now && nowWord)
          ) {
            nowWord = now;
            renderWords();
            if (now && follow && playing) scrollWordIntoView(now.c, now.i, true);
          }
        }

        function previewInfo(item) {
          return {
            pick: item
              ? {
                  id: item.entry.id,
                  start: item.start,
                  duration: item.dur,
                  in: item.in,
                  out: item.out,
                  clip: clips[item.entry.c].key,
                }
              : null,
          };
        }

        function togglePlay() {
          player.toggle();
        }

        function seekPick(dir) {
          if (!program.length) return say("The cut is empty");
          const t = mode === "program" ? player.time() : 0;
          let k;
          if (dir > 0) k = program.findIndex((x) => x.start > t + 0.05);
          else {
            const cur = program.findIndex((x) => t >= x.start - 1e-3 && t < x.start + x.dur);
            k = t - (program[cur]?.start ?? 0) > 0.6 ? cur : cur - 1;
          }
          if (k < 0) k = dir > 0 ? program.length - 1 : 0;
          const item = program[k];
          selId = item.entry.id;
          refreshViews();
          scrollWordIntoView(item.entry.c, item.entry.a, true);
          setMode("program", { time: item.start }).catch(report);
        }

        // ---- Export --------------------------------------------------------------------------
        // The clip whose picture sets the frame when options.frame is auto: the first pick's, else (while the cut is
        // empty) the first suggestion's, else the first clip with media.
        function frameClip() {
          if (program[0]) return clips[program[0].entry.c];
          if (seq[0]) return clips[entryRange(seq[0]).c];
          return clips.find((c) => c.media) ?? null;
        }

        // Output frame: options.frame, else frameClip()'s picture; options.resolution is its short side.
        function outputSize() {
          let ratio;
          if (opts.frame !== "auto") ratio = FRAMES[opts.frame];
          else {
            const clip = frameClip();
            if (!clip)
              throw new Error(
                'transcript-cut: no clip has media to take the frame from; pass options.frame ("9:16", "16:9", "1:1" or "4:5")',
              );
            const meta = clip.media ? probed.get(clip.media) : null;
            if (!meta)
              throw new Error(
                clip.media
                  ? `transcript-cut: the picture size of ${clip.media} is not known yet; try again in a moment`
                  : `transcript-cut: the first pick's clip ${clip.label} has no media to take the frame from; pass options.frame ("9:16", "16:9", "1:1" or "4:5")`,
              );
            if (!meta.width || !meta.height)
              throw new Error(`transcript-cut: ${clip.media} has no picture; pass options.frame`);
            ratio = [meta.width, meta.height];
            if (opts.resolution === 0) return { w: even(meta.width), h: even(meta.height) };
          }
          const short = opts.resolution || 1080;
          const [rw, rh] = ratio;
          return rw <= rh
            ? { w: even(short), h: even((short * rh) / rw) }
            : { w: even((short * rw) / rh), h: even(short) };
        }
        const even = (v) => Math.max(2, Math.round(v / 2) * 2);

        // { edl, script, srt, overlays }: the cut as t3-edl/1 after bolt-on transforms, its render command and captions.
        function buildEdl({ phase = "export" } = {}) {
          rebuildProgram();
          if (!program.length)
            throw new Error("transcript-cut: nothing to export, the cut has no picks");
          const name = slug(opts.title);
          const size = outputSize();
          const used = [...new Set(program.map((x) => x.entry.c))].map((c) => clips[c]);
          let edl = {
            format: "t3-edl/1",
            kind: "transcript-cut",
            title: opts.title,
            width: size.w,
            height: size.h,
            duration: 0,
            targetSeconds: opts.targetSeconds,
            sources: Object.fromEntries(
              used.map((c) => [
                c.source,
                {
                  label: c.label,
                  media: c.media,
                  transcript: c.transcript,
                  duration: r3(c.duration),
                },
              ]),
            ),
            tracks: [
              {
                id: "V1",
                kind: "video",
                clips: program.map((x) => {
                  const p = x.entry;
                  const clip = clips[p.c];
                  const out = {
                    id: p.id,
                    label: clip.label,
                    source: clip.source,
                    media: clip.media,
                    in: x.in,
                    out: x.out,
                    start: x.start,
                    duration: x.dur,
                    words: [p.a, p.b],
                    text: textOf(p.c, p.a, p.b),
                  };
                  if (p.note) out.note = p.note;
                  if (p.sg)
                    out.suggestion = { id: p.sg, status: suggestionStatus(suggById.get(p.sg)) };
                  return out;
                }),
              },
            ],
            markers: [],
          };
          const info = {
            phase,
            pickId: selId && findEntry(selId) && isPick(findEntry(selId)) ? selId : null,
            playhead: mode === "program" ? player.time() : 0,
          };
          edl = rt.transformEdl(edl, { phase, info });
          const out = edl.tracks?.[0]?.clips;
          if (!Array.isArray(out) || !out.length)
            throw new Error("transcript-cut: a bolt-on EDL transform left tracks[0].clips empty");
          const seen = new Set();
          let cursorT = 0;
          for (const [i, c] of out.entries()) {
            if (typeof c.id !== "string" || !c.id || seen.has(c.id))
              throw new Error(
                `transcript-cut: EDL clip ${i + 1} needs its own string id (got ${JSON.stringify(c.id)})`,
              );
            seen.add(c.id);
            if (typeof c.source !== "string" || !/^(\/|[a-z]:[\\/])/i.test(c.source))
              throw new Error(
                `transcript-cut: EDL clip ${c.id} needs source, the original's absolute path`,
              );
            if (!(isNum(c.in) && isNum(c.out) && c.out > c.in))
              throw new Error(`transcript-cut: EDL clip ${c.id} needs in < out in source seconds`);
            c.in = r3(c.in);
            c.out = r3(c.out);
            c.duration = r3(c.out - c.in);
            c.start = r3(cursorT);
            cursorT += c.duration;
          }
          edl.duration = r3(cursorT);
          const fx = rt.exportFilters(edl, { phase, info });
          const overlays = rt.renderOverlays({ phase }).map((o) => ({
            ...o,
            file: `${name}-overlay-${o.id}.png`,
            start: r3(o.start),
            end: r3(o.end),
          }));
          const command = ffmpegCommand(out, size, `${name}.mp4`, fx, overlays);
          const srt = buildSrt(out);
          edl.captions = { file: `${name}.srt`, cues: srt.cues };
          edl.render = {
            output: `${name}.mp4`,
            script: `${name}.render.sh`,
            command,
            notes:
              "Cuts each pick from the original by absolute path (accurate input seek), scales and pads it to the frame, and concatenates them to H.264/AAC with sound. Run it anywhere.",
            boltOn: {
              controls: rt.state(),
              videoFilter: fx.video.join(","),
              audioFilter: fx.audio.join(","),
              notes: fx.notes,
              overlays: overlays.map((o) => ({
                id: o.id,
                file: o.file,
                start: o.start,
                end: o.end,
              })),
            },
          };
          const script = [
            "#!/bin/sh",
            `# Renders ${name}.mp4 from the originals named in ${name}.edl.json.${overlays.length ? " Run it next to the overlay PNGs." : ""}`,
            ...fx.notes.map((n) => `# ${String(n).replace(/\s+/g, " ")}`),
            "set -e",
            command,
            "",
          ].join("\n");
          return { edl, script, srt: srt.text, overlays };
        }

        // One -ss/-t input per pick: ffmpeg seeks each original and decodes only that span.
        function ffmpegCommand(list, size, output, fx, overlays) {
          const { w, h } = size;
          const graph = [];
          const seqPads = [];
          const f = opts.fade;
          list.forEach((c, i) => {
            const d = c.duration;
            const fd = Math.min(f, d / 4);
            graph.push(
              `[${i}:v]trim=duration=${num(d)},setpts=PTS-STARTPTS,scale=${w}:${h}:force_original_aspect_ratio=decrease,pad=${w}:${h}:(ow-iw)/2:(oh-ih)/2,setsar=1,format=yuv420p[v${i}]`,
            );
            const fades =
              fd > 0 ? `,afade=t=in:d=${num(fd)},afade=t=out:st=${num(d - fd)}:d=${num(fd)}` : "";
            graph.push(
              `[${i}:a]atrim=duration=${num(d)},asetpts=PTS-STARTPTS,aformat=sample_rates=48000:channel_layouts=stereo${fades},apad,atrim=duration=${num(d)}[a${i}]`,
            );
            seqPads.push(`[v${i}][a${i}]`);
          });
          graph.push(`${seqPads.join("")}concat=n=${list.length}:v=1:a=1[outv][outa]`);
          let vOut = "[outv]";
          let aOut = "[outa]";
          overlays.forEach((o, k) => {
            graph.push(
              `${vOut}[${list.length + k}:v]overlay=0:0:format=auto:enable='between(t,${num(o.start)},${num(o.end)})'[ov${k}]`,
            );
            vOut = `[ov${k}]`;
          });
          if (fx.video.length) {
            graph.push(`${vOut}${fx.video.join(",")},format=yuv420p[fxv]`);
            vOut = "[fxv]";
          } else if (overlays.length) {
            graph.push(`${vOut}format=yuv420p[fxv]`);
            vOut = "[fxv]";
          }
          if (fx.audio.length) {
            graph.push(`[outa]${fx.audio.join(",")}[fxa]`);
            aOut = "[fxa]";
          }
          return [
            "ffmpeg -y \\",
            ...list.map(
              (c) => `  -ss ${num(c.in)} -t ${num(c.duration)} -i ${shellQuote(c.source)} \\`,
            ),
            ...overlays.map((o) => `  -i ${shellQuote(o.file)} \\`),
            `  -filter_complex ${sq(graph.join(";"))} \\`,
            `  -map "${vOut}" -map "${aOut}" -c:v libx264 -crf 18 -preset medium -pix_fmt yuv420p -c:a aac -b:a 192k -movflags +faststart \\`,
            `  ${shellQuote(output)}`,
          ].join("\n");
        }

        // Captions of the picked words on the cut's clock: a cue ends at a sentence end, a pause, ~42 characters or a
        // pick boundary.
        function buildSrt(list) {
          const cues = [];
          for (const c of list) {
            const clip = byKey.get(c.media ?? "") ?? clips.find((k) => k.source === c.source);
            if (!clip) continue;
            const words = clip.words.filter((w) => w.e > c.in + 0.01 && w.s < c.out - 0.01);
            let cue = null;
            const flush = () => {
              if (cue && cue.words.length) cues.push(cue);
              cue = null;
            };
            for (const w of words) {
              const s = r3(c.start + Math.max(0, w.s - c.in));
              const e = r3(Math.min(c.start + c.duration, c.start + (w.e - c.in)));
              if (cue && (s - cue.end > 0.6 || (cue.text + " " + w.t).length > 42)) flush();
              if (!cue) cue = { start: s, end: e, text: w.t, words: [w.t] };
              else {
                cue.text += ` ${w.t}`;
                cue.words.push(w.t);
                cue.end = e;
              }
              if (w.sentEnd && cue.text.length > 12) flush();
            }
            flush();
          }
          for (let i = 0; i + 1 < cues.length; i++)
            cues[i].end = Math.min(cues[i].end, cues[i + 1].start);
          const text = cues
            .map(
              (q, i) =>
                `${i + 1}\n${srtTime(q.start)} --> ${srtTime(Math.max(q.end, q.start + 0.2))}\n${q.text}\n`,
            )
            .join("\n");
          return { text, cues: cues.length };
        }

        const pngOf = (canvas, what) =>
          new Promise((resolve, reject) => {
            canvas.toBlob(
              (b) =>
                b
                  ? resolve(b)
                  : reject(new Error(`transcript-cut: could not encode ${what} as PNG`)),
              "image/png",
            );
          });

        async function exportBundle() {
          const fc = frameClip();
          if (opts.frame === "auto" && fc && fc.media) await probe(fc);
          const { edl, script, srt, overlays } = buildEdl();
          const name = slug(opts.title);
          const files = [
            new File([JSON.stringify(edl, null, 2)], `${name}.edl.json`, {
              type: "application/json",
            }),
            new File([script], `${name}.render.sh`, { type: "text/x-shellscript" }),
            new File([srt], `${name}.srt`, { type: "application/x-subrip" }),
          ];
          for (const o of overlays)
            files.push(
              new File([await pngOf(o.canvas, `overlay "${o.id}"`)], o.file, { type: "image/png" }),
            );
          return { edl, files };
        }

        async function exportFiles() {
          say("Exporting…");
          const { edl, files } = await exportBundle();
          for (const f of files) {
            await window.t3.workspace.attach(f);
            await window.t3.workspace.download(f, f.name);
          }
          say(
            `Exported ${plural(edl.tracks[0].clips.length, "pick")}, ${fmtLen(edl.duration)}: EDL, render script and captions`,
          );
          return { edl, files, ffmpeg: [edl.render.command] };
        }

        // What Send says: the cut, its length against the target, and what became of each suggestion.
        function summaryOf() {
          const s = {
            picks: program.length,
            seconds: r3(programDuration()),
            target: opts.targetSeconds,
          };
          const counts = { taken: 0, changed: 0, rejected: 0, pending: 0 };
          for (const g of suggestions) counts[suggestionStatus(g)] += 1;
          return { ...s, suggestions: { total: suggestions.length, ...counts } };
        }

        function sendMessage(edl, files) {
          const sum = summaryOf();
          const used = new Set(program.map((x) => x.entry.c));
          const lines = [];
          const len = fmtLen(sum.seconds);
          lines.push(
            sum.target > 0
              ? `Cut ready: ${plural(sum.picks, "pick")} from ${plural(used.size, "clip")}, ${len} against a ${fmtLen(sum.target)} target (${Math.abs(sum.seconds - sum.target) < 0.5 ? "on target" : fmtDelta(sum.seconds - sum.target)}).`
              : `Cut ready: ${plural(sum.picks, "pick")} from ${plural(used.size, "clip")}, ${len}.`,
          );
          if (suggestions.length) {
            const g = sum.suggestions;
            const parts = [`${g.taken + g.changed} of ${g.total} suggestions taken`];
            const changed = suggestions
              .filter((x) => suggestionStatus(x) === "changed")
              .map((x) => `${x.id} ${changeOf(x)}`);
            const rejected = suggestions
              .filter((x) => suggestionStatus(x) === "rejected")
              .map((x) => x.id);
            const pending = suggestions
              .filter((x) => suggestionStatus(x) === "pending")
              .map((x) => x.id);
            if (changed.length) parts.push(`changed ${changed.join("; ")}`);
            if (rejected.length) parts.push(`rejected ${rejected.join(", ")}`);
            if (pending.length) parts.push(`left undecided ${pending.join(", ")}`);
            lines.push(`${parts.join("; ")}.`);
          }
          const own = program.filter((x) => !x.entry.sg).length;
          if (own) lines.push(`${plural(own, "pick")} chosen by the user.`);
          lines.push(
            "Order: " +
              program
                .map(
                  (x, k) =>
                    `${k + 1}. ${clips[x.entry.c].label} ${fmtT(x.in)} “${clipText(x.entry.c, x.entry.a, x.entry.b, 6)}”${x.entry.note ? ` (${x.entry.note})` : ""}`,
                )
                .join(" · "),
          );
          lines.push(
            `Files: ${files.map((f) => f.name).join(", ")}. Render with edl.render.command (it reads the originals by absolute path).`,
          );
          return lines.join("\n");
        }

        // Send is called straight from the click or key press: T3 sends only during the user's gesture.
        async function sendToAgent() {
          const { edl, files } = await exportBundle();
          const keep = files.filter((f) => /\.(edl\.json|srt)$/.test(f.name));
          await window.t3.workspace.send(sendMessage(edl, keep), { files: keep });
          say(
            `Sent the cut (${plural(edl.tracks[0].clips.length, "pick")}, ${fmtLen(edl.duration)}) to the agent`,
          );
        }

        const report = (err) => rt.reportError(err);

        // ---- Persistence -----------------------------------------------------------------------
        // Compact, by time: { p: id, c: clip key, s, e, pi?, po?, n?, g? } for a pick, { g } for a pending suggestion.
        function compactSeq() {
          return seq.map((x) => {
            if (!isPick(x)) return { g: x.sid };
            const clip = clips[x.c];
            const o = { p: x.id, c: clip.key, s: clip.words[x.a].s, e: clip.words[x.b].e };
            if (x.pi !== null && x.pi !== undefined) o.pi = x.pi;
            if (x.po !== null && x.po !== undefined) o.po = x.po;
            if (x.note) o.n = x.note;
            if (x.sg) o.g = x.sg;
            return o;
          });
        }

        // Back from the compact form; entries that no longer fit the transcripts are dropped with a warning.
        function expandSeq(list, where) {
          if (!Array.isArray(list)) throw new Error(`transcript-cut: ${where} is not a list`);
          const out = [];
          const seen = new Set();
          for (const o of list) {
            if (!isObj(o)) continue;
            if (o.p === undefined) {
              if (suggById.has(o.g) && !seen.has(`g:${o.g}`)) {
                seen.add(`g:${o.g}`);
                out.push({ kind: "sugg", sid: o.g });
              } else console.warn(`transcript-cut: ${where}: suggestion ${o.g} is gone, dropped`);
              continue;
            }
            const clip = byKey.get(o.c);
            const r = clip && isNum(o.s) && isNum(o.e) ? wordsIn(clip, o.s, o.e) : null;
            if (!r || typeof o.p !== "string" || seen.has(o.p)) {
              console.warn(
                `transcript-cut: ${where}: pick ${JSON.stringify(o.p)} no longer fits, dropped`,
              );
              continue;
            }
            seen.add(o.p);
            out.push({
              kind: "pick",
              id: o.p,
              c: clip.index,
              a: r.a,
              b: r.b,
              pi: isNum(o.pi) ? clamp(o.pi, 0, MAX_PAD) : null,
              po: isNum(o.po) ? clamp(o.po, 0, MAX_PAD) : null,
              note: typeof o.n === "string" ? o.n : "",
              sg: typeof o.g === "string" && suggById.has(o.g) ? o.g : null,
            });
          }
          return out;
        }

        function bumpIds() {
          for (const x of seq)
            if (isPick(x)) nextPick = Math.max(nextPick, Number(x.id.slice(1)) + 1 || nextPick);
        }

        function scheduleSave() {
          clearTimeout(saveTimer);
          saveTimer = setTimeout(save, 300);
        }

        // The summary goes first (T3 shows the agent the start of the state). History keeps as many of the latest
        // steps as fit the budget (the redo tail goes first); the cut itself always saves when it fits alone.
        function save() {
          saveTimer = 0;
          const base = { v: 1, summary: summaryOf(), seq: compactSeq(), controls: rt.state() };
          const enc = (s) => new TextEncoder().encode(JSON.stringify(s)).length;
          const h = history.get();
          let state = { ...base, history: h };
          let size = enc(state);
          let keep = h.index + 1;
          while (size > STATE_BUDGET && keep > 1) {
            keep = Math.max(1, Math.floor(keep / 2));
            const entries = h.entries.slice(h.index + 1 - keep, h.index + 1);
            state = { ...base, history: { ...h, entries, index: entries.length - 1 } };
            size = enc(state);
          }
          if (size > STATE_BUDGET) {
            state = base;
            size = enc(state);
          }
          unsaved = size > STATE_BUDGET;
          stateBytes = size;
          if (!unsaved) window.t3.workspace.setState(state);
          renderBudget();
        }

        function renderBudget() {
          ui.budget.classList.toggle("bad", unsaved);
          ui.budget.textContent = unsaved
            ? `This cut is too large to save (${(stateBytes / 1024).toFixed(1)} KB of ${(STATE_BUDGET / 1024).toFixed(0)} KB): it still applies; Export keeps it.`
            : `Saved with the thread · ${(stateBytes / 1024).toFixed(1)} of ${(STATE_BUDGET / 1024).toFixed(0)} KB`;
        }

        // ---- Refresh -----------------------------------------------------------------------------
        // The monitor's shape follows the output frame: options.frame, else the first pick's (or clip's) picture.
        function updateMonitorShape() {
          let r = opts.frame === "auto" ? null : FRAMES[opts.frame];
          if (!r) {
            const c = frameClip();
            const m = c && c.media ? probed.get(c.media) : null;
            if (m && m.width && m.height) r = [m.width, m.height];
          }
          ui.monitor.classList.toggle("portrait", Boolean(r && r[1] > r[0]));
        }

        function refreshViews() {
          updateMonitorShape();
          renderWords();
          renderLibrary();
          renderPicks();
          renderStrip();
          renderMeter();
          renderSelInfo();
          renderAcceptAll();
          ui.modeTag.textContent =
            mode === "program"
              ? `Program · ${plural(program.length, "pick")}`
              : `Source · ${clips[sourceClip]?.label ?? ""}`;
        }

        function refreshAll() {
          rebuildProgram();
          refreshViews();
          syncPlayer().catch(report);
          scheduleSave();
          if (api) {
            rt.refresh();
            rt.emitChange();
            rt.syncChrome();
          }
        }

        function renderAcceptAll() {
          const n = pendingSuggestions().length;
          ui.acceptAll.hidden = n === 0;
          ui.acceptAll.firstChild.textContent = `Accept All ${n} `;
        }

        // ---- Bolt-on API -----------------------------------------------------------------------
        function publicPick(x) {
          const item = program.find((p) => p.entry === x);
          const clip = clips[x.c];
          return {
            id: x.id,
            clip: clip.key,
            start: clip.words[x.a].s,
            end: clip.words[x.b].e,
            in: item.in,
            out: item.out,
            duration: item.dur,
            programStart: item.start,
            text: textOf(x.c, x.a, x.b),
            note: x.note ?? "",
            padIn: x.pi ?? opts.padding,
            padOut: x.po ?? opts.padding,
            suggestion: x.sg,
          };
        }

        function getValues() {
          return {
            title: opts.title,
            duration: r3(programDuration()),
            targetSeconds: opts.targetSeconds,
            mode,
            playhead: player.time(),
            selection: selection
              ? {
                  clip: clips[selection.c].key,
                  start: clips[selection.c].words[selection.a].s,
                  end: clips[selection.c].words[selection.b].e,
                  text: textOf(selection.c, selection.a, selection.b),
                }
              : null,
            clips: clips.map((c) => ({
              key: c.key,
              label: c.label,
              media: c.media,
              source: c.source,
              duration: c.duration,
              words: c.words.length,
              speech: c.words.length
                ? { start: c.words[0].s, end: c.words[c.words.length - 1].e }
                : null,
            })),
            picks: picks().map(publicPick),
            suggestions: suggestions.map((s) => ({
              id: s.id,
              clip: clips[s.c].key,
              start: clips[s.c].words[s.a].s,
              end: clips[s.c].words[s.b].e,
              text: textOf(s.c, s.a, s.b),
              note: s.note,
              status: suggestionStatus(s),
            })),
          };
        }

        // setValues({ picks?, accept?, reject?, playhead? }, label?) -> getValues(). Strict; one undo step.
        function setValues(partial, label = "Script Edit") {
          if (!isObj(partial)) throw new TypeError("setValues(partial) needs an object");
          for (const key of Object.keys(partial))
            if (!["picks", "accept", "reject", "playhead"].includes(key))
              throw new TypeError(
                `setValues: unknown key "${key}" (use picks, accept, reject, playhead)`,
              );
          let next = null;
          if (partial.picks !== undefined) {
            if (!Array.isArray(partial.picks))
              throw new TypeError("setValues.picks must be an array");
            next = partial.picks.map((p, i) => {
              const at = `setValues.picks[${i}]`;
              if (!isObj(p)) throw new TypeError(`${at} must be an object`);
              for (const k of Object.keys(p))
                if (
                  !["id", "clip", "start", "end", "note", "padIn", "padOut", "suggestion"].includes(
                    k,
                  )
                )
                  throw new TypeError(`${at}: unknown key "${k}"`);
              const clip = byKey.get(p.clip);
              if (!clip)
                throw new Error(
                  `${at}.clip "${p.clip}" names no clip (${clips.map((c) => c.key).join(", ")})`,
                );
              if (!(isNonNeg(p.start) && isNonNeg(p.end) && p.end > p.start))
                throw new RangeError(`${at}: start and end must be seconds with start < end`);
              const r = wordsIn(clip, p.start, p.end);
              if (!r)
                throw new RangeError(
                  `${at}: ${p.start}..${p.end} s covers no word of ${clip.label}`,
                );
              for (const k of ["padIn", "padOut"])
                if (p[k] !== undefined && !(isNonNeg(p[k]) && p[k] <= MAX_PAD))
                  throw new RangeError(`${at}.${k} must be 0..${MAX_PAD} seconds`);
              if (p.note !== undefined && typeof p.note !== "string")
                throw new TypeError(`${at}.note must be a string`);
              if (
                p.suggestion !== undefined &&
                p.suggestion !== null &&
                !suggById.has(p.suggestion)
              )
                throw new Error(`${at}.suggestion "${p.suggestion}" is not a suggestion id`);
              return {
                kind: "pick",
                id: typeof p.id === "string" && /^p\d+$/.test(p.id) ? p.id : null,
                c: clip.index,
                a: r.a,
                b: r.b,
                pi: p.padIn ?? null,
                po: p.padOut ?? null,
                note: p.note ?? "",
                sg: p.suggestion ?? null,
              };
            });
          }
          const ids = (v, key) => {
            if (v === undefined) return [];
            const list = v === "all" ? suggestions.map((s) => s.id) : v;
            if (!Array.isArray(list) || !list.every((s) => suggById.has(s)))
              throw new TypeError(
                `setValues.${key} must be "all" or suggestion ids (${suggestions.map((s) => s.id).join(", ")})`,
              );
            return list;
          };
          const acc = ids(partial.accept, "accept");
          const rej = ids(partial.reject, "reject");
          if (partial.playhead !== undefined && !isNonNeg(partial.playhead))
            throw new TypeError("setValues.playhead must be seconds >= 0");
          let changed = false;
          if (next) {
            const keep = pendingSuggestions().filter((x) => !next.some((p) => p.sg === x.sid));
            const used = new Set();
            for (const p of next) {
              if (!p.id || used.has(p.id)) p.id = newPickId();
              used.add(p.id);
            }
            seq = [...next, ...keep];
            bumpIds();
            changed = true;
          }
          if (acc.length && accept(acc)) changed = true;
          if (rej.length && reject(rej)) changed = true;
          if (changed) {
            if (selId && !findEntry(selId)) selId = null;
            afterEdit(label);
          }
          if (partial.playhead !== undefined)
            setMode("program", { time: partial.playhead }).catch(report);
          return getValues();
        }

        function frameInfo() {
          const size = outputSize();
          return {
            width: size.w,
            height: size.h,
            duration: r3(Math.max(programDuration(), 0.001)),
          };
        }

        function createRuntime() {
          return window.t3kit.templateRuntime.create({
            id: "transcript-cut",
            pipeline: "edl",
            // 'top': under the length meter, above Picks; 'bottom': under Picks and History, above the composer.
            addPanel(title, { open, position }) {
              const d = el("details", "panel");
              d.open = open;
              const body = el("div", "panel-body");
              d.append(el("summary", null, title), body);
              ui.insp.insertBefore(d, position === "top" ? ui.tabs : ui.budget);
              return body;
            },
            toolbar: ui.toolbar,
            buttonClass: "btn",
            previewTarget: ui.monitor,
            frame: () => frameInfo(),
            export: () => exportFiles(),
            audioPreview: () => [player],
            chrome: {
              toolbar: () => [
                {
                  type: "button",
                  id: "play",
                  label: "Play / Pause",
                  icon: "play",
                  shortcut: "space",
                  run: () => togglePlay(),
                },
                {
                  type: "button",
                  id: "prev",
                  label: "Previous Pick",
                  icon: "skip-back",
                  shortcut: "shift+n",
                  run: () => seekPick(-1),
                },
                {
                  type: "button",
                  id: "next",
                  label: "Next Pick",
                  icon: "skip-forward",
                  shortcut: "n",
                  run: () => seekPick(1),
                },
                {
                  type: "segmented",
                  id: "monitor",
                  label: "Monitor",
                  options: [
                    { value: "program", label: "Program" },
                    { value: "source", label: "Source" },
                  ],
                  value: mode,
                  run: (v) => setMode(v === "source" ? "source" : "program").catch(report),
                },
                { type: "separator" },
                {
                  type: "button",
                  id: "accept",
                  label: "Accept Suggestion",
                  icon: "check",
                  shortcut: "a",
                  run: () => cmdAccept(),
                },
                {
                  type: "button",
                  id: "accept-all",
                  label: "Accept All Suggestions",
                  icon: "check-check",
                  shortcut: "shift+a",
                  run: () => cmdAcceptAll(),
                },
                { type: "separator" },
                {
                  type: "button",
                  id: "undo",
                  label: "Undo",
                  icon: "undo-2",
                  run: () => history.undo(),
                },
                {
                  type: "button",
                  id: "redo",
                  label: "Redo",
                  icon: "redo-2",
                  run: () => history.redo(),
                },
                { type: "separator" },
                {
                  type: "button",
                  id: "export",
                  label: "Export",
                  icon: "download",
                  shortcut: "e",
                  run: () => exportFiles().catch(report),
                },
              ],
              native: (on) => $("app").classList.toggle("native", on),
            },
            getValues: () => getValues(),
            setValues: (partial, label) => setValues(partial, label),
            reservedKeys: RESERVED,
            onBoltOnChange: () => {
              if (api) scheduleSave();
            },
          });
        }

        // ---- Pointer: word selection and pick reordering -----------------------------------------
        function wordFromEvent(e) {
          const t = e.target instanceof Element ? e.target.closest(".w") : null;
          return t ? { c: Number(t.dataset.c), i: Number(t.dataset.i) } : null;
        }

        let drag = null; // { c, i, moved }
        let dragFrame = 0;
        let dragPoint = null;
        function onDocDown(e) {
          if (e.button !== 0) return;
          const ts = e.target instanceof Element ? e.target.closest(".ts") : null;
          if (ts) {
            e.preventDefault();
            const c = Number(ts.dataset.c);
            const i = Number(ts.dataset.i);
            moveCursor(c, i, false);
            setMode("source", { c, time: clips[c].words[i].s, play: true }).catch(report);
            return;
          }
          const w = wordFromEvent(e);
          if (!w) return;
          e.preventDefault();
          ui.doc.focus({ preventScroll: true });
          if (e.shiftKey) {
            const from = anchor && anchor.c === w.c ? anchor : cursor.c === w.c ? cursor : w;
            anchor = { ...from };
            selection = { c: w.c, a: Math.min(from.i, w.i), b: Math.max(from.i, w.i) };
            cursor = { ...w };
            renderWords();
            renderSelInfo();
            return;
          }
          drag = { c: w.c, i: w.i, moved: false };
          anchor = { ...w };
        }
        function onDocMove(e) {
          if (!drag) return;
          dragPoint = { x: e.clientX, y: e.clientY };
          if (!dragFrame) dragFrame = requestAnimationFrame(flushDrag);
        }
        function flushDrag() {
          dragFrame = 0;
          if (!drag || !dragPoint) return;
          const hit = document.elementFromPoint(dragPoint.x, dragPoint.y);
          const t = hit instanceof Element ? hit.closest(".w") : null;
          if (!t) return;
          const c = Number(t.dataset.c);
          if (c !== drag.c) return;
          const i = Number(t.dataset.i);
          if (i === drag.i && !drag.moved) return;
          drag.moved = true;
          selection = { c, a: Math.min(drag.i, i), b: Math.max(drag.i, i) };
          cursor = { c, i };
          renderWords();
          renderSelInfo();
        }
        function onDocUp(e) {
          if (!drag) return;
          if (dragFrame) {
            cancelAnimationFrame(dragFrame);
            dragFrame = 0;
          }
          if (dragPoint) flushDrag();
          const d = drag;
          drag = null;
          dragPoint = null;
          if (d.moved) return;
          clickWord(d.c, d.i);
        }

        // A click puts the cursor on the word and seeks: in the cut when the word is picked, else in its source.
        function clickWord(c, i) {
          selection = null;
          cursor = { c, i };
          const under = coverage()[c][i];
          if (under) selId = entryId(under);
          refreshViews();
          renderLibraryCurrent();
          const item = under && isPick(under) ? program.find((x) => x.entry === under) : null;
          const w = clips[c].words[i];
          if (item)
            setMode("program", { time: r3(item.start + Math.max(0, w.s - item.in)) }).catch(report);
          else if (clips[c].media)
            setMode("source", { c, time: Math.max(0, w.s - 0.05) }).catch(report);
          else say(`${clips[c].label} has no media attached, so it cannot play`);
        }

        // Picks list: click selects and seeks; the grip drags an entry to a new place.
        let reorder = null; // { id, to, row }
        let reorderFrame = 0;
        let reorderY = 0;
        function onPicksDown(e) {
          const row = e.target instanceof Element ? e.target.closest(".entry") : null;
          if (!row) return;
          if (e.target.closest(".grip")) {
            e.preventDefault();
            reorder = { id: row.dataset.id, to: null, row };
            row.classList.add("dragging");
          }
        }
        function onPicksMove(e) {
          if (!reorder) return;
          reorderY = e.clientY;
          if (!reorderFrame) reorderFrame = requestAnimationFrame(flushReorder);
        }
        function flushReorder() {
          reorderFrame = 0;
          if (!reorder) return;
          const rows = [...ui.picksPanel.querySelectorAll(".entry")];
          for (const r of rows) r.classList.remove("drop-before", "drop-after");
          let to = rows.length;
          for (let k = 0; k < rows.length; k++) {
            const box = rows[k].getBoundingClientRect();
            if (reorderY < box.top + box.height / 2) {
              to = k;
              break;
            }
          }
          reorder.to = to;
          if (to < rows.length) rows[to].classList.add("drop-before");
          else if (rows.length) rows[rows.length - 1].classList.add("drop-after");
        }
        function onPicksUp(e) {
          if (!reorder) return;
          if (reorderFrame) {
            cancelAnimationFrame(reorderFrame);
            reorderFrame = 0;
          }
          flushReorder();
          const { id, to } = reorder;
          reorder = null;
          const x = findEntry(id);
          const from = seq.indexOf(x);
          const at = to > from ? to - 1 : to;
          if (to !== null && moveEntry(id, at)) {
            selId = id;
            afterEdit("Reorder");
          } else renderPicks();
        }
        function onPicksClick(e) {
          const row = e.target instanceof Element ? e.target.closest(".entry") : null;
          if (!row || e.target.closest(".grip, .entry-tools")) return;
          selectEntry(row.dataset.id, true);
        }

        function selectEntry(id, seek) {
          const x = findEntry(id);
          if (!x) return;
          selId = id;
          const r = entryRange(x);
          selection = null;
          cursor = { c: r.c, i: r.a };
          refreshViews();
          scrollWordIntoView(r.c, r.a, true);
          if (!seek) return;
          if (isPick(x)) {
            const item = program.find((p) => p.entry === x);
            setMode("program", { time: item.start }).catch(report);
          } else if (clips[r.c].media)
            setMode("source", { c: r.c, time: pickTimes(r).in }).catch(report);
        }

        function onStripClick(e) {
          if (!program.length) return;
          const box = ui.strip.getBoundingClientRect();
          const t = clamp(
            ((e.clientX - box.left) / box.width) * programDuration(),
            0,
            programDuration() - 0.01,
          );
          const item = programAt(t);
          if (item) selId = item.entry.id;
          refreshViews();
          setMode("program", { time: t }).catch(report);
        }

        // ---- Keyboard ------------------------------------------------------------------------------
        const isField = (t) =>
          t instanceof HTMLInputElement ||
          t instanceof HTMLTextAreaElement ||
          t instanceof HTMLSelectElement ||
          t?.isContentEditable;
        const isTextEntry = (t) =>
          (t instanceof HTMLInputElement && /^(text|search|number)$/.test(t.type)) ||
          t instanceof HTMLTextAreaElement;

        function onKey(e) {
          if (!api || e.defaultPrevented) return;
          const mod = e.metaKey || e.ctrlKey;
          if (mod && e.key === "Enter") {
            e.preventDefault();
            sendToAgent().catch(report);
            return;
          }
          if (e.target === ui.search) return onSearchKey(e);
          if (isField(e.target) || mod) return;
          const k = e.key;
          if (e.altKey) {
            if (k === "ArrowUp") cmdMove(-1);
            else if (k === "ArrowDown") cmdMove(1);
            else if (k === "ArrowLeft") stepSentence(-1, e.shiftKey);
            else if (k === "ArrowRight") stepSentence(1, e.shiftKey);
            else return;
            e.preventDefault();
            return;
          }
          if (k === " " && e.target instanceof HTMLButtonElement) return;
          if (k === " ") togglePlay();
          else if (k === "ArrowLeft") stepCursor(-1, e.shiftKey);
          else if (k === "ArrowRight") stepCursor(1, e.shiftKey);
          else if (k === "ArrowUp") stepParagraph(-1, e.shiftKey);
          else if (k === "ArrowDown") stepParagraph(1, e.shiftKey);
          else if (k === "Enter") cmdAdd();
          else if (k === "Backspace" || k === "Delete") cmdRemove();
          else if (k === "Escape") {
            clearSelection();
            renderWords();
          } else if (k === "a") cmdAccept();
          else if (k === "A") cmdAcceptAll();
          else if (k === "x" || k === "X") cmdReject();
          else if (k === "s" || k === "S") cmdSelectSentence();
          else if (k === "[") cmdNudge("start", -1);
          else if (k === "{") cmdNudge("start", 1);
          else if (k === "]") cmdNudge("end", 1);
          else if (k === "}") cmdNudge("end", -1);
          else if (k === "n") seekPick(1);
          else if (k === "N") seekPick(-1);
          else if (k === "m" || k === "M")
            setMode(
              mode === "program" ? "source" : "program",
              mode === "program"
                ? { c: cursor.c, time: clips[cursor.c]?.words[cursor.i]?.s ?? 0 }
                : {},
            ).catch(report);
          else if (k === "d" || k === "D") setView(!pickedOnly);
          else if (k === "f" || k === "F") setFollow(!follow);
          else if (k === "e" || k === "E") exportFiles().catch(report);
          else if (k === "/") {
            ui.search.focus();
            ui.search.select();
          } else return;
          e.preventDefault();
        }

        function onSearchKey(e) {
          if (e.key === "ArrowDown") goToHit(hitIndex + 1);
          else if (e.key === "ArrowUp") goToHit(hitIndex - 1);
          else if (e.key === "Enter") {
            goToHit(hitIndex < 0 ? 0 : hitIndex);
            ui.doc.focus({ preventScroll: true });
          } else if (e.key === "Escape") {
            ui.search.value = "";
            runSearch();
            ui.doc.focus({ preventScroll: true });
          } else return;
          e.preventDefault();
        }

        function setView(only) {
          pickedOnly = only;
          ui.doc.classList.toggle("only", only);
          ui.viewAll.setAttribute("aria-pressed", String(!only));
          ui.viewPicked.setAttribute("aria-pressed", String(only));
        }
        function setFollow(on) {
          follow = on;
          ui.follow.setAttribute("aria-pressed", String(on));
          say(on ? "The transcript follows playback" : "The transcript stays put during playback");
        }

        // ---- Startup ---------------------------------------------------------------------------------
        async function start() {
          opts = readOptions();
          document.title = opts.title;
          ui.title.textContent = opts.title;
          const ws = await window.t3.workspace.ready();
          await loadClips(ws.assets ?? []);
          readSuggestions();
          const saved = ws.state ?? (await window.t3.workspace.initialState()) ?? null;
          const restored = isObj(saved) && saved.v === 1 && Array.isArray(saved.seq) ? saved : null;
          seq = restored
            ? expandSeq(restored.seq, "saved cut")
            : suggestions.map((s) => ({ kind: "sugg", sid: s.id }));
          bumpIds();
          if (!restored && opts.accept) accept(suggestions.map((s) => s.id));
          rebuildProgram();

          renderTranscript();
          player = window.t3kit.player.create(ui.player, {
            value: programValue(),
            media: mediaMap(),
            controls: false,
          });
          programKey = JSON.stringify(programValue());
          history = window.t3kit.history.create(ui.history, {
            title: "History",
            keys: false,
            label: restored ? "Restored" : "Original",
          });
          if (restored && isObj(restored.history)) history.set(restored.history);
          historyLink = rt.linkHistory(
            history,
            () => ({ seq: compactSeq() }),
            (s) => {
              seq = expandSeq(s.seq, "history step");
              bumpIds();
              if (selId && !findEntry(selId)) selId = null;
              refreshAll();
            },
          );
          history.on("change", () => scheduleSave());
          player.on("timeupdate", onTime);
          player.on("error", ({ message }) =>
            report(new Error(`transcript-cut: playback stopped: ${message}`)),
          );

          // An expiring media URL is swapped for a fresh one; playback resumes where it was.
          window.t3.workspace.on("asset-url", ({ name, url }) => {
            const clip = clips.find((c) => c.media === name);
            if (!clip || typeof url !== "string") return;
            clip.url = url;
            const time = player.time();
            const playing = player.get().playing;
            player.set({ media: mediaMap(), time, playing }).catch(report);
          });

          ui.doc.addEventListener("pointerdown", onDocDown);
          // A drag follows the pointer anywhere in the page, so it keeps going past the transcript's edges.
          window.addEventListener("pointermove", onDocMove);
          window.addEventListener("pointerup", onDocUp);
          window.addEventListener("pointercancel", onDocUp);
          ui.doc.addEventListener("click", (e) => {
            const chip = e.target instanceof Element ? e.target.closest(".silent-clip") : null;
            if (chip) playSilent(Number(chip.dataset.c));
          });
          ui.hideSilent.addEventListener("change", () => {
            $("app").classList.toggle("hide-silent", ui.hideSilent.checked);
          });
          ui.doc.addEventListener("dblclick", (e) => {
            const w = wordFromEvent(e);
            if (!w) return;
            cursor = w;
            cmdSelectSentence();
          });
          ui.libList.addEventListener("click", (e) => {
            const t = e.target instanceof Element ? e.target : null;
            const res = t?.closest(".result");
            if (res) return goToHit(Number(res.dataset.k));
            const row = t?.closest(".clip-row");
            if (!row) return;
            const c = Number(row.dataset.c);
            clipEls[c]?.scrollIntoView({ block: clips[c].words.length ? "start" : "nearest" });
            if (clips[c].words.length) {
              moveCursor(c, 0, false);
              renderLibraryCurrent();
            } else playSilent(c);
          });
          ui.picksPanel.addEventListener("pointerdown", onPicksDown);
          window.addEventListener("pointermove", onPicksMove);
          window.addEventListener("pointerup", onPicksUp);
          window.addEventListener("pointercancel", onPicksUp);
          ui.picksPanel.addEventListener("click", onPicksClick);
          ui.strip.addEventListener("click", onStripClick);
          ui.search.addEventListener("input", runSearch);
          ui.play.addEventListener("click", togglePlay);
          ui.prevPick.addEventListener("click", () => seekPick(-1));
          ui.nextPick.addEventListener("click", () => seekPick(1));
          ui.modeProgram.addEventListener("click", () => setMode("program").catch(report));
          ui.modeSource.addEventListener("click", () =>
            setMode("source", {
              c: cursor.c,
              time: clips[cursor.c]?.words[cursor.i]?.s ?? 0,
            }).catch(report),
          );
          ui.viewAll.addEventListener("click", () => setView(false));
          ui.viewPicked.addEventListener("click", () => setView(true));
          ui.follow.addEventListener("click", () => setFollow(!follow));
          ui.acceptAll.addEventListener("click", cmdAcceptAll);
          ui.export.addEventListener("click", () => exportFiles().catch(report));
          ui.send.addEventListener("click", () => sendToAgent().catch(report));
          ui.tabPicks.addEventListener("click", () => setTab("picks"));
          ui.tabHistory.addEventListener("click", () => setTab("history"));
          document.addEventListener("keydown", onKey);

          // The first pick's picture size decides the export frame; the rest load in the background.
          const firstMedia = frameClip();
          if (firstMedia && firstMedia.media) await probe(firstMedia);
          for (const c of clips) if (c.media) probe(c).then(updateMonitorShape, report);

          api = rt.publish({
            instances: { player, history },
            extras: { links: { history: historyLink }, buildEdl, exportBundle },
            saved: restored?.controls,
          });
          const firstSpoken = clips.findIndex((c) => c.words.length);
          cursor = { c: Math.max(0, firstSpoken), i: 0 };
          refreshAll();
          renderMode();
          ui.tc.textContent = `${fmtT(0)} / ${fmtT(programDuration())}`;
          ui.ptc.textContent = `${fmtT(0)} / ${fmtT(programDuration())}`;
          const nSugg = pendingSuggestions().length;
          say(
            clips.length
              ? nSugg
                ? `${plural(nSugg, "suggestion")} from the agent: A accepts one, Shift+A all`
                : `${plural(clips.length, "clip")} loaded`
              : "No transcripts attached",
          );
          rt.setPreviewTime(0, previewInfo(program[0] ?? null));
          rt.runCustomScript(opts.customScript, opts);
        }

        // A clip without speech (B-roll) has no words to pick: its chip plays it in Source.
        function playSilent(c) {
          const clip = clips[c];
          for (const chip of ui.doc.querySelectorAll(".silent-clip"))
            chip.setAttribute("aria-current", String(Number(chip.dataset.c) === c));
          if (!clip.media) return say(`${clip.label} has no media attached, so it cannot play`);
          say(`${clip.label}: no speech in its transcript (B-roll), playing it in Source`);
          setMode("source", { c, time: 0, play: true }).catch(report);
        }

        function setTab(tab) {
          ui.tabPicks.setAttribute("aria-selected", String(tab === "picks"));
          ui.tabHistory.setAttribute("aria-selected", String(tab === "history"));
          ui.picksPanel.hidden = tab !== "picks";
          ui.historyPanel.hidden = tab !== "history";
        }

        // ---- Wiring --------------------------------------------------------------------------------
        for (const id of [
          "title",
          "tc",
          "status",
          "toolbar",
          "acceptAll",
          "export",
          "send",
          "search",
          "searchMeta",
          "libList",
          "libStats",
          "hideSilentWrap",
          "hideSilent",
          "selInfo",
          "viewAll",
          "viewPicked",
          "follow",
          "doc",
          "insp",
          "monitor",
          "player",
          "modeTag",
          "monitorNote",
          "monitorNoteText",
          "prevPick",
          "play",
          "playIcon",
          "nextPick",
          "ptc",
          "modeProgram",
          "modeSource",
          "strip",
          "meter",
          "tabs",
          "tabPicks",
          "tabHistory",
          "pickCount",
          "picksPanel",
          "historyPanel",
          "history",
          "budget",
        ])
          ui[id] = $(id);
        $("sendKey").textContent = MAC ? "⌘↵" : "Ctrl+↵";
        rt = createRuntime();

        // One undo stack: Cmd/Ctrl+Z goes to History.
        document.addEventListener(
          "keydown",
          (e) => {
            if (!(e.metaKey || e.ctrlKey) || e.altKey || !history || isTextEntry(e.target)) return;
            const k = e.key.toLowerCase();
            if (k === "z" && !e.shiftKey) history.undo();
            else if ((k === "z" && e.shiftKey) || (k === "y" && e.ctrlKey && !e.metaKey))
              history.redo();
            else return;
            e.preventDefault();
            e.stopPropagation();
          },
          true,
        );

        window.addEventListener("unhandledrejection", (e) => report(e.reason));

        start().catch(report);
      })();
    </script>
  </body>
</html>
