<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transcript Cut</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--background);
        color: var(--foreground);
        font: 12px/1.45 var(--font-sans);
        overflow: hidden;
      }
      button,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      kbd {
        display: inline-block;
        min-width: 16px;
        padding: 0 4px;
        border: 1px solid var(--border);
        border-bottom-width: 2px;
        border-radius: 4px;
        font: 10px/14px var(--font-mono);
        text-align: center;
        color: var(--muted-foreground);
        background: var(--background);
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        min-height: 0;
      }
      .top {
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 44px;
        padding: 0 12px;
        border-bottom: 1px solid var(--border);
        background: var(--card);
      }
      .top h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 32vw;
      }
      .tc {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--muted-foreground);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .status {
        font-size: 11px;
        color: var(--muted-foreground);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
        max-width: 36vw;
      }
      .toolbar {
        display: flex;
        gap: 6px;
      }
      .toolbar:empty {
        display: none;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) - 3px);
        background: var(--card);
        cursor: pointer;
        white-space: nowrap;
      }
      .btn:hover:not(:disabled) {
        background: var(--muted);
      }
      .btn:focus-visible,
      .iconbtn:focus-visible,
      .seg button:focus-visible,
      .tab:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 1px;
      }
      .btn.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--primary-foreground);
      }
      .btn.primary:hover:not(:disabled) {
        background: var(--primary);
        opacity: 0.9;
      }
      .btn.primary kbd {
        color: var(--primary-foreground);
        border-color: color-mix(in srgb, var(--primary-foreground) 45%, transparent);
        background: transparent;
      }
      .btn.suggest {
        border-style: dashed;
        border-color: var(--info);
        color: var(--info);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .btn.sm {
        height: 22px;
        padding: 0 7px;
        font-size: 11px;
      }
      .btn[hidden] {
        display: none;
      }
      .iconbtn {
        display: inline-grid;
        place-items: center;
        width: 26px;
        height: 26px;
        padding: 0;
        border: 0;
        border-radius: calc(var(--radius) - 3px);
        background: transparent;
        cursor: pointer;
        color: var(--foreground);
      }
      .iconbtn:hover:not(:disabled) {
        background: var(--muted);
      }
      .iconbtn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .iconbtn svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
      }
      .iconbtn.play {
        width: 30px;
        height: 30px;
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .iconbtn.play:hover:not(:disabled) {
        background: var(--primary);
        opacity: 0.9;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) - 3px);
        overflow: hidden;
      }
      .seg button {
        height: 22px;
        padding: 0 8px;
        border: 0;
        background: var(--card);
        font-size: 11px;
        cursor: pointer;
        color: var(--muted-foreground);
      }
      .seg button + button {
        border-left: 1px solid var(--border);
      }
      .seg button[aria-pressed="true"] {
        background: var(--accent);
        color: var(--accent-foreground);
      }
      .stage {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 248px minmax(0, 1fr) 408px;
      }
      .pane-head {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 10px;
        border-bottom: 1px solid var(--border);
      }
      .pane-head b,
      .label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted-foreground);
        white-space: nowrap;
      }
      .muted {
        color: var(--muted-foreground);
      }
      .mono {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }

      /* ---- Library: search and clips ---- */
      .lib {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        background: var(--card);
      }
      .search {
        flex: none;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
      }
      .search-box {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 8px;
        border: 1px solid var(--input);
        border-radius: calc(var(--radius) - 3px);
        background: var(--background);
      }
      .search-box:focus-within {
        border-color: var(--ring);
      }
      .search-box svg {
        width: 13px;
        height: 13px;
        fill: var(--muted-foreground);
        flex: none;
      }
      .search-box input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
      }
      .search-meta {
        display: flex;
        justify-content: space-between;
        margin-top: 6px;
        font-size: 11px;
        color: var(--muted-foreground);
      }
      .lib-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 4px 0;
      }
      .clip-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 2px 8px;
        width: 100%;
        padding: 6px 10px 7px;
        border: 0;
        border-left: 2px solid transparent;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      .clip-row:hover {
        background: var(--muted);
      }
      .clip-row[aria-current="true"] {
        border-left-color: var(--primary);
        background: color-mix(in srgb, var(--primary) 8%, transparent);
      }
      .clip-row:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: -2px;
      }
      .clip-name {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .clip-dur {
        font: 11px var(--font-mono);
        color: var(--muted-foreground);
        text-align: right;
      }
      .clip-sub {
        display: flex;
        gap: 6px;
        align-items: center;
        min-width: 0;
        font-size: 11px;
        color: var(--muted-foreground);
        grid-column: 1 / -1;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        height: 16px;
        padding: 0 5px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font: 10px/1 var(--font-mono);
        white-space: nowrap;
      }
      .chip.pick {
        border-color: color-mix(in srgb, var(--primary) 50%, transparent);
        color: var(--foreground);
        background: color-mix(in srgb, var(--primary) 14%, transparent);
      }
      .chip.sugg {
        border-style: dashed;
        border-color: var(--info);
        color: var(--info);
      }
      .chip.warn {
        border-color: var(--warning);
        color: var(--warning);
      }
      .cover {
        position: relative;
        grid-column: 1 / -1;
        height: 3px;
        margin-top: 3px;
        border-radius: 2px;
        background: var(--muted);
        overflow: hidden;
      }
      .cover i {
        position: absolute;
        top: 0;
        bottom: 0;
        background: var(--primary);
      }
      .cover i.g {
        background: var(--info);
        opacity: 0.6;
      }
      .result {
        display: block;
        width: 100%;
        padding: 6px 10px;
        border: 0;
        border-bottom: 1px solid var(--border);
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      .result:hover,
      .result[aria-selected="true"] {
        background: var(--muted);
      }
      .result-head {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--muted-foreground);
      }
      .result mark {
        background: color-mix(in srgb, var(--warning) 35%, transparent);
        color: inherit;
        border-radius: 2px;
      }
      .lib-foot {
        flex: none;
        padding: 6px 10px;
        border-top: 1px solid var(--border);
        font-size: 11px;
        color: var(--muted-foreground);
      }
      .empty {
        padding: 10px;
        color: var(--muted-foreground);
      }

      /* ---- Transcript ---- */
      .doc {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--background);
      }
      .doc-head .sel-info {
        font: 11px var(--font-mono);
        color: var(--muted-foreground);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .doc-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        outline: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .doc-scroll:focus-visible {
        box-shadow: inset 0 0 0 2px var(--ring);
      }
      .tclip {
        padding: 0 0 14px;
      }
      .tclip-head {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 30px;
        padding: 0 18px;
        border-bottom: 1px solid var(--border);
        background: var(--background);
      }
      .tclip-head .clip-name {
        font-size: 12px;
      }
      .tclip-head .src {
        font: 11px var(--font-mono);
        color: var(--muted-foreground);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .para {
        display: grid;
        grid-template-columns: 52px minmax(0, 1fr);
        gap: 10px;
        padding: 5px 18px 5px 8px;
        font-size: 14.5px;
        line-height: 1.75;
        max-width: 860px;
      }
      .para .ts {
        padding-top: 3px;
        font: 10.5px/1.9 var(--font-mono);
        color: var(--muted-foreground);
        text-align: right;
        cursor: pointer;
      }
      .para .ts:hover {
        color: var(--foreground);
      }
      .words {
        color: color-mix(in srgb, var(--foreground) 74%, transparent);
      }
      .w {
        border-radius: 2px;
        cursor: text;
      }
      .w:hover {
        color: var(--foreground);
        text-decoration: underline;
        text-decoration-color: var(--border);
        text-underline-offset: 4px;
      }
      /* A pick: solid tint; the shadow fills the following space so a pick reads as one run. */
      .w.p {
        color: var(--foreground);
        background: color-mix(in srgb, var(--primary) 26%, var(--background));
        box-shadow: 0.4em 0 0 color-mix(in srgb, var(--primary) 26%, var(--background));
      }
      .w.p.pe {
        box-shadow: none;
      }
      .w.p.k {
        background: color-mix(in srgb, var(--primary) 42%, var(--background));
        box-shadow: 0.4em 0 0 color-mix(in srgb, var(--primary) 42%, var(--background));
      }
      .w.p.k.pe {
        box-shadow: none;
      }
      /* The agent's suggestion: dashed and in the info colour until the user takes it. */
      .w.g {
        color: var(--foreground);
        background: color-mix(in srgb, var(--info) 9%, var(--background));
        box-shadow: 0.4em 0 0 color-mix(in srgb, var(--info) 9%, var(--background));
        text-decoration: underline dashed var(--info);
        text-decoration-thickness: 1.5px;
        text-underline-offset: 4px;
      }
      .w.g.pe {
        box-shadow: none;
      }
      .w.g.k {
        background: color-mix(in srgb, var(--info) 20%, var(--background));
        box-shadow: 0.4em 0 0 color-mix(in srgb, var(--info) 20%, var(--background));
      }
      .w.g.k.pe {
        box-shadow: none;
      }
      .w.hit {
        background: color-mix(in srgb, var(--warning) 32%, var(--background));
      }
      .w.sel {
        color: var(--foreground);
        background: color-mix(in srgb, var(--ring) 34%, var(--background));
        box-shadow: 0.4em 0 0 color-mix(in srgb, var(--ring) 34%, var(--background));
      }
      .w.sel.se {
        box-shadow: none;
      }
      .w.cur {
        outline: 1.5px solid var(--ring);
        outline-offset: 1px;
      }
      .w.now {
        color: var(--primary-foreground);
        background: var(--primary);
        box-shadow: none;
      }
      .only .para.off {
        display: none;
      }
      .only .tclip.off {
        display: none;
      }
      .only .w:not(.p):not(.g) {
        opacity: 0.4;
      }
      .silent {
        padding: 8px 18px 12px;
        border-bottom: 1px solid var(--border);
      }
      .silent-head {
        margin-bottom: 6px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted-foreground);
      }
      .silent-list {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .silent-clip {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        height: 22px;
        padding: 0 8px;
        border: 1px solid var(--border);
        border-radius: 11px;
        background: var(--card);
        font-size: 11px;
        cursor: pointer;
      }
      .silent-clip:hover {
        background: var(--muted);
      }
      .silent-clip[aria-current="true"] {
        border-color: var(--ring);
      }
      .silent-clip:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 1px;
      }
      .only .silent,
      .hide-silent .silent {
        display: none;
      }
      .clip-row.silent-row {
        padding-top: 4px;
        padding-bottom: 4px;
      }
      .clip-row.silent-row .clip-name {
        font-weight: 400;
        color: var(--muted-foreground);
      }
      .clip-row.silent-row .clip-sub,
      .clip-row.silent-row .cover {
        display: none;
      }
      .clip-row.silent-row .clip-dur::before {
        content: "no speech · ";
        font-family: var(--font-sans);
      }
      .hide-silent .clip-row.silent-row {
        display: none;
      }
      .lib-foot {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .lib-foot label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-left: auto;
        white-space: nowrap;
        cursor: pointer;
      }
      .lib-foot label[hidden] {
        display: none;
      }
      .lib-foot input {
        margin: 0;
        accent-color: var(--primary);
      }
      .tclip-nomedia {
        padding: 2px 18px 0 70px;
        font-size: 11px;
        color: var(--warning);
      }
      .doc-foot {
        flex: none;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        padding: 6px 12px;
        border-top: 1px solid var(--border);
        background: var(--card);
        font-size: 11px;
        color: var(--muted-foreground);
      }

      /* ---- Inspector ---- */
      .insp {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        border-left: 1px solid var(--border);
        background: var(--card);
      }
      .monitor {
        position: relative;
        flex: none;
        height: clamp(200px, 34vh, 380px);
        background: var(--muted);
        border-bottom: 1px solid var(--border);
      }
      /* Portrait footage (iPhone 9:16) gets a taller monitor. */
      .monitor.portrait {
        height: clamp(240px, 42vh, 540px);
      }
      .player {
        position: absolute;
        inset: 0;
      }
      .monitor-note {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        color: var(--muted-foreground);
        pointer-events: none;
      }
      .monitor-note[hidden] {
        display: none;
      }
      .monitor-note span {
        max-width: 280px;
        padding: 6px 10px;
        border-radius: calc(var(--radius) - 3px);
        background: var(--popover);
        border: 1px solid var(--border);
      }
      .mode-tag {
        position: absolute;
        left: 8px;
        top: 8px;
        padding: 1px 7px;
        border-radius: calc(var(--radius) - 4px);
        border: 1px solid var(--border);
        background: var(--popover);
        font: 10.5px/1.6 var(--font-mono);
        pointer-events: none;
        max-width: calc(100% - 16px);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .transport {
        flex: none;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px 10px;
      }
      .transport .tc {
        margin-left: 6px;
        color: var(--foreground);
      }
      .strip {
        flex: none;
        position: relative;
        display: flex;
        height: 30px;
        margin: 0 10px 8px;
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) - 3px);
        background: var(--muted);
        overflow: hidden;
        cursor: pointer;
      }
      .strip-empty {
        margin: auto;
        font-size: 11px;
        color: var(--muted-foreground);
      }
      .blk {
        position: relative;
        min-width: 3px;
        height: 100%;
        border-right: 1px solid var(--card);
        overflow: hidden;
        font: 10px/28px var(--font-mono);
        padding-left: 4px;
        white-space: nowrap;
        color: var(--foreground);
      }
      .blk[aria-current="true"] {
        box-shadow: inset 0 0 0 2px var(--ring);
      }
      .blk.nomedia {
        background-image: repeating-linear-gradient(
          135deg,
          transparent 0 4px,
          color-mix(in srgb, var(--warning) 30%, transparent) 4px 6px
        );
      }
      .playhead {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        margin-left: -1px;
        background: var(--foreground);
        pointer-events: none;
      }
      .meter {
        flex: none;
        padding: 0 10px 10px;
        border-bottom: 1px solid var(--border);
      }
      .meter-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 5px;
      }
      .meter-row .big {
        font: 600 15px var(--font-mono);
        font-variant-numeric: tabular-nums;
      }
      .meter-row .delta {
        font: 11px var(--font-mono);
      }
      .delta.ok {
        color: var(--success);
      }
      .delta.over {
        color: var(--warning);
      }
      .delta.under {
        color: var(--muted-foreground);
      }
      .bar {
        position: relative;
        height: 8px;
        border-radius: 4px;
        background: var(--muted);
      }
      .bar i {
        position: absolute;
        top: 0;
        bottom: 0;
      }
      .bar .fill {
        left: 0;
        border-radius: 4px;
        background: var(--primary);
      }
      .bar .fill.over {
        background: var(--warning);
      }
      .bar .ghost {
        background: repeating-linear-gradient(
          135deg,
          color-mix(in srgb, var(--info) 55%, transparent) 0 3px,
          transparent 3px 6px
        );
      }
      .bar .target {
        top: -4px;
        bottom: -4px;
        width: 2px;
        margin-left: -1px;
        border-radius: 1px;
        background: var(--foreground);
      }
      .panel {
        flex: none;
        padding: 10px;
        border-bottom: 1px solid var(--border);
      }
      .panel > summary {
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted-foreground);
      }
      .panel > summary::-webkit-details-marker {
        display: none;
      }
      .panel-body {
        margin-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .tabs {
        flex: none;
        display: flex;
        align-items: center;
        gap: 2px;
        height: 34px;
        padding: 0 8px;
        border-bottom: 1px solid var(--border);
      }
      .tab {
        height: 26px;
        padding: 0 9px;
        border: 0;
        border-radius: calc(var(--radius) - 3px);
        background: transparent;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted-foreground);
        cursor: pointer;
      }
      .tab[aria-selected="true"] {
        background: var(--muted);
        color: var(--foreground);
      }
      .tabpanel {
        flex: 1 1 0;
        min-height: 96px;
        overflow-y: auto;
      }
      .tabpanel[hidden] {
        display: none;
      }
      .history-host {
        height: 100%;
        min-height: 180px;
      }
      .entry {
        position: relative;
        display: grid;
        grid-template-columns: 14px 20px minmax(0, 1fr) auto;
        gap: 0 6px;
        align-items: start;
        padding: 7px 10px 7px 6px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
      }
      .entry:hover {
        background: color-mix(in srgb, var(--foreground) 4%, transparent);
      }
      .entry[aria-selected="true"] {
        background: color-mix(in srgb, var(--primary) 9%, transparent);
        box-shadow: inset 2px 0 0 var(--primary);
      }
      .entry.sugg {
        background: color-mix(in srgb, var(--info) 5%, transparent);
      }
      .entry.sugg::after {
        content: "";
        position: absolute;
        inset: 3px 4px;
        border: 1px dashed color-mix(in srgb, var(--info) 70%, transparent);
        border-radius: calc(var(--radius) - 3px);
        pointer-events: none;
      }
      .entry.sugg[aria-selected="true"] {
        box-shadow: inset 2px 0 0 var(--info);
      }
      .entry.drop-before {
        box-shadow: inset 0 2px 0 var(--ring);
      }
      .entry.drop-after {
        box-shadow: inset 0 -2px 0 var(--ring);
      }
      .entry.dragging {
        opacity: 0.5;
      }
      .grip {
        width: 14px;
        height: 30px;
        cursor: grab;
        touch-action: none;
        background: radial-gradient(circle, var(--muted-foreground) 1px, transparent 1.4px) 0 0 /
          5px 5px;
        opacity: 0.45;
      }
      .grip:hover {
        opacity: 0.9;
      }
      .num {
        font: 600 11px/20px var(--font-mono);
        color: var(--muted-foreground);
        text-align: right;
      }
      .entry-main {
        min-width: 0;
      }
      .entry-head {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        font-size: 11px;
        color: var(--muted-foreground);
        line-height: 20px;
      }
      .entry-head .clip-name {
        color: var(--foreground);
        font-size: 11px;
        max-width: 150px;
      }
      .tag {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .tag.sugg {
        color: var(--info);
      }
      .tag.taken {
        color: var(--success);
      }
      .tag.changed {
        color: var(--warning);
      }
      .entry-text {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        font-size: 12.5px;
        line-height: 1.45;
      }
      .entry-note {
        margin-top: 2px;
        font-size: 11px;
        color: var(--muted-foreground);
        font-style: italic;
      }
      .entry-dur {
        font: 11px/20px var(--font-mono);
        color: var(--muted-foreground);
        text-align: right;
        white-space: nowrap;
      }
      .entry-tools {
        grid-column: 3 / -1;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 6px;
        margin-top: 6px;
      }
      .entry-tools .grp {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        font-size: 11px;
        color: var(--muted-foreground);
      }
      .entry-tools .iconbtn {
        width: 22px;
        height: 22px;
        border: 1px solid var(--border);
      }
      .entry-tools input[type="number"] {
        width: 52px;
        height: 22px;
        padding: 0 4px;
        border: 1px solid var(--input);
        border-radius: calc(var(--radius) - 4px);
        background: var(--background);
        font: 11px var(--font-mono);
      }
      .entry-tools textarea {
        width: 100%;
        min-height: 40px;
        padding: 4px 6px;
        border: 1px solid var(--input);
        border-radius: calc(var(--radius) - 4px);
        background: var(--background);
        resize: vertical;
        font-size: 12px;
      }
      .entry-tools > .entry-note {
        flex-basis: 100%;
        margin: 0 0 2px;
      }
      .entry-tools .spacer {
        flex: 1;
      }
      .budget {
        padding: 6px 10px;
        font-size: 11px;
        color: var(--muted-foreground);
        border-top: 1px solid var(--border);
      }
      .budget.bad {
        color: var(--warning);
      }
      .composer {
        width: 100%;
        min-width: 320px;
        flex: none;
        margin-top: auto;
      }
      .app.native .page-chrome {
        display: none;
      }
      @media (max-width: 1180px) {
        .stage {
          grid-template-columns: 210px minmax(0, 1fr) 360px;
        }
      }
      @media (max-width: 900px) {
        body {
          overflow: auto;
        }
        .app {
          height: auto;
          min-height: 100vh;
        }
        .stage {
          grid-template-columns: minmax(0, 1fr);
        }
        .lib {
          max-height: 40vh;
        }
        .doc {
          height: 70vh;
        }
        .insp {
          border-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <header class="top">
        <h1 id="title">Transcript Cut</h1>
        <span class="tc" id="tc">00:00.0 / 00:00.0</span>
        <span class="grow"></span>
        <span class="status" id="status" aria-live="polite"></span>
        <div class="toolbar page-chrome" id="toolbar"></div>
        <button
          class="btn suggest page-chrome"
          id="acceptAll"
          type="button"
          hidden
          title="Take every pending suggestion as it is, in its place in the order (Shift+A)"
        >
          Accept All <kbd>⇧A</kbd>
        </button>
        <button
          class="btn page-chrome"
          id="export"
          type="button"
          title="Download and attach the EDL, the ffmpeg render script and the SRT captions (E)"
        >
          Export
        </button>
        <button
          class="btn primary"
          id="send"
          type="button"
          title="Send the cut to the agent: a summary plus the EDL and captions (Cmd/Ctrl+Enter)"
        >
          Send <kbd id="sendKey">⌘↵</kbd>
        </button>
      </header>
      <main class="stage">
        <aside class="lib" aria-label="Clips">
          <div class="search">
            <label class="search-box">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="M7 2a5 5 0 0 1 3.9 8.1l3 3-1 1-3-3A5 5 0 1 1 7 2zm0 1.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"
                />
              </svg>
              <input
                id="search"
                type="search"
                placeholder="Search all transcripts"
                aria-label="Search all transcripts (/)"
                autocomplete="off"
                spellcheck="false"
              />
              <kbd>/</kbd>
            </label>
            <div class="search-meta" id="searchMeta" hidden></div>
          </div>
          <div class="lib-list" id="libList" role="list"></div>
          <div class="lib-foot">
            <span id="libStats"></span>
            <label
              id="hideSilentWrap"
              hidden
              title="Hide clips whose transcript has no words (B-roll)"
            >
              <input type="checkbox" id="hideSilent" /> Hide no speech
            </label>
          </div>
        </aside>
        <section class="doc" aria-label="Transcript">
          <div class="pane-head doc-head">
            <b>Transcript</b>
            <span class="sel-info" id="selInfo"></span>
            <span class="grow"></span>
            <div class="seg" role="group" aria-label="Transcript view">
              <button type="button" id="viewAll" aria-pressed="true" title="Every word (D toggles)">
                All
              </button>
              <button
                type="button"
                id="viewPicked"
                aria-pressed="false"
                title="Only paragraphs with picks or suggestions (D toggles)"
              >
                Picked
              </button>
            </div>
            <button
              class="btn sm"
              id="follow"
              type="button"
              aria-pressed="true"
              title="Scroll the transcript with playback (F)"
            >
              Follow
            </button>
          </div>
          <div
            class="doc-scroll"
            id="doc"
            tabindex="0"
            role="application"
            aria-label="Transcript words: drag or Shift+arrows to select, Enter to pick, Backspace to remove"
          ></div>
          <div class="doc-foot" id="legend">
            <span><kbd>drag</kbd> / <kbd>⇧</kbd><kbd>←→</kbd> select</span>
            <span><kbd>↵</kbd> pick</span>
            <span><kbd>⌫</kbd> remove</span>
            <span><kbd>S</kbd> sentence</span>
            <span><kbd>A</kbd> accept · <kbd>⇧A</kbd> all · <kbd>X</kbd> reject</span>
            <span><kbd>[</kbd><kbd>]</kbd> extend · <kbd>{</kbd><kbd>}</kbd> shrink</span>
            <span><kbd>⌥↑↓</kbd> reorder</span>
            <span><kbd>N</kbd> next pick</span>
            <span><kbd>Space</kbd> play · <kbd>M</kbd> source</span>
          </div>
        </section>
        <aside class="insp" id="insp" aria-label="Program">
          <div class="monitor" id="monitor">
            <div class="player" id="player"></div>
            <div class="mode-tag" id="modeTag">Program</div>
            <div class="monitor-note" id="monitorNote" hidden>
              <span id="monitorNoteText"></span>
            </div>
          </div>
          <div class="transport">
            <button class="iconbtn" id="prevPick" type="button" title="Previous pick (Shift+N)">
              <svg viewBox="0 0 16 16"><path d="M3 3h1.6v10H3zM13 3v10L5.4 8z" /></svg>
            </button>
            <button class="iconbtn play" id="play" type="button" title="Play / pause (Space)">
              <svg viewBox="0 0 16 16"><path id="playIcon" d="M5 3v10l8-5z" /></svg>
            </button>
            <button class="iconbtn" id="nextPick" type="button" title="Next pick (N)">
              <svg viewBox="0 0 16 16"><path d="M3 3v10l7.6-5zM11.4 3H13v10h-1.6z" /></svg>
            </button>
            <span class="tc" id="ptc">00:00.0 / 00:00.0</span>
            <span class="grow"></span>
            <div class="seg" role="group" aria-label="Monitor">
              <button type="button" id="modeProgram" aria-pressed="true" title="Play the cut (M)">
                Program
              </button>
              <button
                type="button"
                id="modeSource"
                aria-pressed="false"
                title="Play the clip under the cursor, uncut (M)"
              >
                Source
              </button>
            </div>
          </div>
          <div class="strip" id="strip" title="The cut, pick by pick: click to seek"></div>
          <div class="meter" id="meter"></div>
          <div class="tabs" role="tablist" id="tabs">
            <button class="tab" role="tab" id="tabPicks" aria-selected="true" type="button">
              Picks
            </button>
            <button class="tab" role="tab" id="tabHistory" aria-selected="false" type="button">
              History
            </button>
            <span class="grow"></span>
            <span class="muted" id="pickCount"></span>
          </div>
          <div class="tabpanel" id="picksPanel" role="tabpanel"></div>
          <div class="tabpanel" id="historyPanel" role="tabpanel" hidden>
            <div class="history-host" id="history"></div>
          </div>
          <div class="budget" id="budget"></div>
          <div class="composer" id="composer" data-t3-composer></div>
        </aside>
      </main>
    </div>
    <script>
      (function () {
        "use strict";

        // ---- Options and constants -------------------------------------------------
        const DEFAULTS = {
          title: "Transcript Cut",
          clips: [],
          highlights: [],
          accept: false,
          targetSeconds: 60,
          padding: 0.08,
          fade: 0.02,
          frame: "auto",
          resolution: 1080,
          customScript: "",
          controls: {},
        };
        const FRAMES = { "9:16": [9, 16], "16:9": [16, 9], "1:1": [1, 1], "4:5": [4, 5] };
        const RESOLUTIONS = [0, 720, 1080, 1440, 2160];
        const MEDIA_RE = /\.(mp4|mov|m4v|webm|mkv|m4a|mp3|wav|aac|ogg|opus)$/i;
        const STATE_BUDGET = 60000; // bytes of the 64 KB state the page lets itself use
        const MAX_PAD = 2;
        const PARA_GAP = 1.2; // seconds of silence that start a new paragraph
        const PARA_MIN = 14; // a sentence end after this many seconds starts one too
        const PARA_MAX = 40;
        const MAX_RESULTS = 200;
        const RESERVED = [
          "space",
          "enter",
          "backspace",
          "delete",
          "escape",
          "a",
          "shift+a",
          "x",
          "s",
          "[",
          "]",
          "{",
          "}",
          "n",
          "shift+n",
          "m",
          "d",
          "f",
          "e",
          "/",
          "mod+enter",
          "mod+z",
          "mod+shift+z",
          "mod+y",
        ];
        const ICON_PLAY = "M5 3v10l8-5z";
        const ICON_PAUSE = "M4 3h3v10H4zM9 3h3v10H9z";
        const MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);

        // ---- Small helpers ---------------------------------------------------------
        const $ = (id) => document.getElementById(id);
        const el = (tag, cls, text) => {
          const n = document.createElement(tag);
          if (cls) n.className = cls;
          if (text !== undefined) n.textContent = text;
          return n;
        };
        const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
        const r3 = (v) => Math.round(v * 1000) / 1000;
        const num = (v) =>
          Number(v)
            .toFixed(3)
            .replace(/\.?0+$/, "") || "0";
        const isNum = (v) => typeof v === "number" && Number.isFinite(v);
        const isObj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
        const plural = (n, one, many = `${one}s`) => `${n} ${n === 1 ? one : many}`;
        const fmtT = (t) => {
          const s = Math.max(0, t);
          const m = Math.floor(s / 60);
          return `${String(m).padStart(2, "0")}:${(s - m * 60).toFixed(1).padStart(4, "0")}`;
        };
        const fmtLen = (t) => {
          const s = Math.round(Math.max(0, t));
          return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
        };
        const fmtDelta = (d) => `${d < 0 ? "−" : "+"}${fmtLen(Math.abs(d))}`;
        const srtTime = (t) => {
          const ms = Math.max(0, Math.round(t * 1000));
          const p = (n, w = 2) => String(n).padStart(w, "0");
          return `${p(Math.floor(ms / 3600000))}:${p(Math.floor(ms / 60000) % 60)}:${p(Math.floor(ms / 1000) % 60)},${p(ms % 1000, 3)}`;
        };
        const baseName = (n) => String(n).replace(/\.[^./]+$/, "");
        const slug = (s) =>
          String(s)
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "") || "cut";
        const shellQuote = (s) => `"${String(s).replace(/(["\\$`])/g, "\\$1")}"`;
        const sq = (s) => `'${String(s).replace(/'/g, "'\\''")}'`;
        const normWord = (t) =>
          String(t)
            .toLowerCase()
            .replace(/[\u2019']/g, "'")
            .replace(/[^\p{L}\p{N}']+/gu, "");
        const isMediaAsset = (a) =>
          /^(video|audio)\//.test(a.mimeType ?? "") || MEDIA_RE.test(a.name ?? "");
        const isTranscriptName = (n) => /\.json$/i.test(n ?? "");

        // ---- State -------------------------------------------------------------------
        // clips[i] = { key, label, media (asset name | null), url, source (absolute path), transcript (asset name),
        //   duration, words: [{ s, e, t, n (normalised), seg, sentEnd }], segs: [{ a, b, s }], meta (probed size) }
        // seq: the ordered cut. Each entry is a pick { kind: 'pick', id, c, a, b, pi, po, note, sg } (a..b = word
        //   indices in clip c, pi/po = handles in seconds or null for the default, sg = the suggestion it came from)
        //   or a pending suggestion { kind: 'sugg', sid }. suggestions: [{ id, c, a, b, note }] from options.
        const clips = [];
        const byKey = new Map();
        const suggestions = [];
        const suggById = new Map();
        let seq = [];
        let nextPick = 1;
        let opts = null;
        let rt = null;
        let api = null;
        let player = null;
        let history = null;
        let historyLink = null;
        const ui = {};
        const wordEls = []; // wordEls[c][i] -> span
        const paraEls = []; // paraEls[c][segIndex] -> element
        const clipEls = []; // clip section in the transcript
        const wordClass = []; // last class string per word, so updates only touch what changed
        let cursor = { c: 0, i: 0 };
        let anchor = null; // { c, i } of a selection
        let selection = null; // { c, a, b } or null
        let selId = null; // selected entry: pick id or 'g:' + suggestion id
        let mode = "program"; // 'program' | 'source'
        let sourceClip = -1;
        let program = []; // [{ entry, start, in, out, dur }]
        let programKey = "";
        let nowWord = null; // { c, i }
        let follow = true;
        let pickedOnly = false;
        let hits = []; // search results [{ c, a, b }]
        let hitIndex = -1;
        let saveTimer = 0;
        let stateBytes = 0;
        let unsaved = false;
        const probes = new Map(); // media name -> Promise<{ width, height, duration }>
        const probed = new Map(); // media name -> { width, height, duration }

        // ---- Options -------------------------------------------------------------------
        function pickOption(raw, key, ok) {
          if (raw[key] === undefined) return structuredClone(DEFAULTS[key]);
          if (ok(raw[key])) return raw[key];
          console.warn(
            `transcript-cut: option "${key}" is invalid, using ${JSON.stringify(DEFAULTS[key])}`,
          );
          return structuredClone(DEFAULTS[key]);
        }
        const isNonNeg = (v) => isNum(v) && v >= 0;
        const optStr = (v) => v === undefined || typeof v === "string";
        const clipsOk = (v) =>
          Array.isArray(v) &&
          v.every(
            (c) =>
              isObj(c) &&
              Object.keys(c).every((k) => ["media", "transcript", "source", "label"].includes(k)) &&
              typeof c.transcript === "string" &&
              optStr(c.media) &&
              optStr(c.label) &&
              (c.source === undefined ||
                (typeof c.source === "string" && /^(\/|[a-z]:[\\/])/i.test(c.source))),
          );
        const highlightsOk = (v) =>
          Array.isArray(v) &&
          v.every(
            (h) =>
              isObj(h) &&
              Object.keys(h).every((k) => ["clip", "start", "end", "note", "order"].includes(k)) &&
              typeof h.clip === "string" &&
              isNonNeg(h.start) &&
              isNonNeg(h.end) &&
              h.end > h.start &&
              optStr(h.note) &&
              (h.order === undefined || isNum(h.order)),
          );
        function readOptions() {
          const raw = JSON.parse(
            document.getElementById("t3-template-options")?.textContent || "{}",
          );
          return {
            title: pickOption(raw, "title", (v) => typeof v === "string" && v.trim() !== ""),
            clips: pickOption(raw, "clips", clipsOk),
            highlights: pickOption(raw, "highlights", highlightsOk),
            accept: pickOption(raw, "accept", (v) => typeof v === "boolean"),
            targetSeconds: pickOption(raw, "targetSeconds", isNonNeg),
            padding: pickOption(raw, "padding", (v) => isNonNeg(v) && v <= MAX_PAD),
            fade: pickOption(raw, "fade", (v) => isNonNeg(v) && v <= 1),
            frame: pickOption(raw, "frame", (v) => v === "auto" || Object.hasOwn(FRAMES, v)),
            resolution: pickOption(raw, "resolution", (v) => RESOLUTIONS.includes(v)),
            customScript: pickOption(raw, "customScript", (v) => typeof v === "string"),
            controls: pickOption(raw, "controls", isObj),
          };
        }

        // ---- Loading clips and transcripts -----------------------------------------------
        function checkTranscript(doc, name) {
          const bad = (why) => new Error(`transcript-cut: ${name} is not a transcript (${why})`);
          if (!isObj(doc) || doc.v !== 1) throw bad('expected { "v": 1, ... }');
          if (!isNum(doc.duration) || doc.duration <= 0) throw bad("duration must be seconds > 0");
          if (!Array.isArray(doc.words)) throw bad("words must be an array");
          doc.words.forEach((w, i) => {
            if (!isObj(w) || !isNum(w.start) || !isNum(w.end) || typeof w.text !== "string")
              throw bad(`words[${i}] must be { start, end, text }`);
          });
          if (doc.segments !== undefined && !Array.isArray(doc.segments))
            throw bad("segments must be an array");
        }

        // Words in time order, each tagged with its paragraph (transcript segment) and whether it ends a sentence.
        function buildWords(doc) {
          const words = doc.words
            .filter((w) => w.text.trim() !== "")
            .map((w) => ({
              s: r3(Math.max(0, w.start)),
              e: r3(Math.max(w.start, w.end)),
              t: w.text.trim(),
            }))
            .sort((x, y) => x.s - y.s);
          for (const w of words) {
            w.n = normWord(w.t);
            w.sentEnd = /[.?!…]["”')\]]*$/.test(w.t);
          }
          const segs = [];
          const segTimes = (doc.segments ?? [])
            .filter((s) => isObj(s) && isNum(s.start) && isNum(s.end))
            .sort((x, y) => x.start - y.start);
          let k = 0;
          words.forEach((w, i) => {
            // A word belongs to the last segment that starts at or before its middle.
            const mid = (w.s + w.e) / 2;
            while (k + 1 < segTimes.length && segTimes[k + 1].start <= mid + 1e-3) k++;
            const startNew =
              i === 0 ||
              (segTimes.length
                ? words[i - 1].seg !== k
                : words[i - 1].sentEnd && w.s - words[i - 1].e > 0.6);
            if (startNew) segs.push({ a: i, b: i, s: w.s });
            w.seg = segTimes.length ? k : segs.length - 1;
            segs[segs.length - 1].b = i;
          });
          // Transcript segments are phrases of a few seconds; paragraphs join them until a pause, or a sentence end once
          // the paragraph is long enough to read as one.
          const paras = [];
          for (const p of segs) {
            const last = paras[paras.length - 1];
            const gap = last ? words[p.a].s - words[last.b].e : Infinity;
            const len = last ? words[last.b].e - last.s : 0;
            const ended = last ? words[last.b].sentEnd : true;
            if (last && gap < PARA_GAP && len < PARA_MAX && !(ended && len >= PARA_MIN))
              last.b = p.b;
            else paras.push({ ...p });
          }
          segs.length = 0;
          segs.push(...paras);
          // seg holds the paragraph index from here on.
          segs.forEach((p, n) => {
            for (let i = p.a; i <= p.b; i++) words[i].seg = n;
            words[p.b].sentEnd = true;
          });
          return { words, segs };
        }

        // A transcript's stem: IMG_0151.transcript.json (media_prepare's name) and IMG_0151.json both give IMG_0151.
        const transcriptStem = (name) => baseName(name).replace(/\.(transcript|words)$/i, "");

        async function readTranscript(asset) {
          if (!asset.file)
            throw new Error(`transcript-cut: transcript ${asset.name} arrived without its file`);
          const text = await asset.file.text();
          try {
            return JSON.parse(text);
          } catch (err) {
            throw new Error(`transcript-cut: ${asset.name} is not JSON (${err.message})`);
          }
        }

        // Pairs each transcript with its media: options.clips names them; otherwise a transcript's "source" (the
        // original's absolute path) matches the media asset's path, and failing that the base names match
        // (IMG_0151.MOV + IMG_0151.transcript.json).
        async function loadClips(assets) {
          const byName = new Map(assets.map((a) => [a.name, a]));
          const media = assets.filter(isMediaAsset);
          const bySource = (doc) =>
            typeof doc.source === "string" && doc.source
              ? (media.find((m) => typeof m.path === "string" && m.path === doc.source) ?? null)
              : null;
          const byStem = (stem) =>
            media.find((m) => baseName(m.name) === stem || m.name === stem) ?? null;
          const plan = [];
          if (opts.clips.length) {
            opts.clips.forEach((c, i) => {
              const t = byName.get(c.transcript);
              if (!t) {
                console.warn(
                  `transcript-cut: clips[${i}].transcript "${c.transcript}" is not attached, skipped`,
                );
                return;
              }
              const m = c.media === undefined ? undefined : (byName.get(c.media) ?? null);
              if (m === null)
                console.warn(
                  `transcript-cut: clips[${i}].media "${c.media}" is not attached; the clip edits and exports, without a preview`,
                );
              plan.push({ t, m, label: c.label, source: c.source, mediaName: c.media });
            });
          } else {
            for (const t of assets.filter((a) => isTranscriptName(a.name) && !isMediaAsset(a)))
              plan.push({ t, m: undefined, label: undefined });
          }
          const docs = await Promise.all(plan.map((p) => readTranscript(p.t)));
          plan.forEach((p, i) => {
            const doc = docs[i];
            // JSON files that are not transcripts (a config, say) are skipped when clips is not given.
            if (!opts.clips.length && (!isObj(doc) || doc.v !== 1 || !Array.isArray(doc.words))) {
              console.warn(`transcript-cut: ${p.t.name} is not a transcript, skipped`);
              return;
            }
            checkTranscript(doc, p.t.name);
            // undefined = not named: find it by the transcript's source path, else by base name.
            const m = p.m === undefined ? (bySource(doc) ?? byStem(transcriptStem(p.t.name))) : p.m;
            const { words, segs } = buildWords(doc);
            const source =
              p.source ??
              (m && typeof m.path === "string" && m.path ? m.path : null) ??
              (typeof doc.source === "string" && doc.source ? doc.source : null);
            if (!source)
              throw new Error(
                `transcript-cut: no source path for ${p.t.name}: give clips[].source, attach the media, or set "source" in the transcript`,
              );
            const key = m ? m.name : (p.mediaName ?? p.t.name);
            if (byKey.has(key)) {
              console.warn(`transcript-cut: ${key} is listed twice, the second is skipped`);
              return;
            }
            if (m && typeof m.url !== "string")
              throw new Error(`transcript-cut: media ${m.name} arrived without a url`);
            const clip = {
              index: clips.length,
              key,
              label: p.label ?? (m ? baseName(m.name) : transcriptStem(p.t.name)),
              media: m ? m.name : null,
              url: m ? m.url : null,
              source,
              transcript: p.t.name,
              duration: doc.duration,
              model: typeof doc.model === "string" ? doc.model : null,
              words,
              segs,
            };
            clips.push(clip);
            byKey.set(key, clip);
            byKey.set(baseName(key), byKey.get(baseName(key)) ?? clip);
            byKey.set(clip.label, byKey.get(clip.label) ?? clip);
          });
          const unpaired = media.filter((m) => !clips.some((c) => c.media === m.name));
          // options.clips leaves media out on purpose; without it, media with no transcript is worth a word.
          if (unpaired.length && !opts.clips.length)
            console.warn(
              `transcript-cut: no transcript for ${unpaired.map((m) => m.name).join(", ")}; run media_prepare on it to edit it here`,
            );
        }

        // Media metadata through the URL (the browser reads only the header); never the bytes in script.
        // At most PROBE_SLOTS media elements read headers at once, so 84 clips do not open 84 players.
        const PROBE_SLOTS = 4;
        let probing = 0;
        const probeQueue = [];
        function probeNext() {
          while (probing < PROBE_SLOTS && probeQueue.length) {
            const job = probeQueue.shift();
            probing += 1;
            job().finally(() => {
              probing -= 1;
              probeNext();
            });
          }
        }
        function probe(clip) {
          if (!clip.media) return Promise.reject(new Error(`${clip.label} has no media attached`));
          if (!probes.has(clip.media)) {
            probes.set(
              clip.media,
              new Promise((resolve, reject) => {
                probeQueue.push(
                  () =>
                    new Promise((done) => {
                      const v = document.createElement("video");
                      v.preload = "metadata";
                      v.muted = true;
                      v.onloadedmetadata = () => {
                        const meta = {
                          width: v.videoWidth,
                          height: v.videoHeight,
                          duration: v.duration,
                        };
                        v.removeAttribute("src");
                        v.load();
                        probed.set(clip.media, meta);
                        resolve(meta);
                        done();
                      };
                      v.onerror = () => {
                        reject(
                          new Error(
                            `transcript-cut: cannot read ${clip.media} (media error ${v.error ? v.error.code : "?"})`,
                          ),
                        );
                        done();
                      };
                      v.src = clip.url;
                    }),
                );
                probeNext();
              }),
            );
          }
          return probes.get(clip.media);
        }

        // ---- Suggestions -----------------------------------------------------------------
        // A time range snapped to the words it overlaps; null when it covers no word.
        function wordsIn(clip, s, e) {
          const w = clip.words;
          let a = -1;
          let b = -1;
          for (let i = 0; i < w.length; i++) {
            const mid = (w[i].s + w[i].e) / 2;
            if (mid >= s - 1e-3 && mid <= e + 1e-3) {
              if (a < 0) a = i;
              b = i;
            }
          }
          return a < 0 ? null : { a, b };
        }

        function readSuggestions() {
          const list = opts.highlights.map((h, i) => ({ h, i }));
          list.sort((x, y) => (x.h.order ?? x.i) - (y.h.order ?? y.i) || x.i - y.i);
          for (const { h, i } of list) {
            const clip = byKey.get(h.clip);
            if (!clip) {
              console.warn(
                `transcript-cut: highlights[${i}].clip "${h.clip}" names no clip (${clips.map((c) => c.label).join(", ")}), skipped`,
              );
              continue;
            }
            const r = wordsIn(clip, h.start, h.end);
            if (!r) {
              console.warn(
                `transcript-cut: highlights[${i}] (${h.start}..${h.end} s) covers no word of ${clip.label}, skipped`,
              );
              continue;
            }
            const s = { id: `s${i + 1}`, c: clip.index, a: r.a, b: r.b, note: h.note ?? "" };
            suggestions.push(s);
            suggById.set(s.id, s);
          }
        }

        // ---- Model queries -----------------------------------------------------------------
        const isPick = (x) => x.kind === "pick";
        const picks = () => seq.filter(isPick);
        const entryRange = (x) => (isPick(x) ? x : suggById.get(x.sid));
        const entryId = (x) => (isPick(x) ? x.id : `g:${x.sid}`);
        const findEntry = (id) => seq.find((x) => entryId(x) === id) ?? null;
        const pendingSuggestions = () => seq.filter((x) => !isPick(x));

        function suggestionStatus(s) {
          if (seq.some((x) => !isPick(x) && x.sid === s.id)) return "pending";
          const from = seq.filter((x) => isPick(x) && x.sg === s.id);
          if (!from.length) return "rejected";
          if (from.length === 1 && from[0].c === s.c && from[0].a === s.a && from[0].b === s.b)
            return "taken";
          return "changed";
        }

        // How a taken suggestion was changed, in words.
        function changeOf(s) {
          const from = seq.filter((x) => isPick(x) && x.sg === s.id);
          if (from.length > 1) return `split in ${from.length}`;
          const p = from[0];
          const bits = [];
          if (p.a < s.a) bits.push(`starts ${plural(s.a - p.a, "word")} earlier`);
          if (p.a > s.a) bits.push(`starts ${plural(p.a - s.a, "word")} later`);
          if (p.b > s.b) bits.push(`ends ${plural(p.b - s.b, "word")} later`);
          if (p.b < s.b) bits.push(`ends ${plural(s.b - p.b, "word")} earlier`);
          return bits.join(", ");
        }

        // In and out in source seconds: the words plus their handles, never into a neighbouring word.
        function pickTimes(p) {
          const clip = clips[p.c];
          const w = clip.words;
          const first = w[p.a];
          const last = w[p.b];
          const prev = w[p.a - 1];
          const next = w[p.b + 1];
          const pi = p.pi ?? opts.padding;
          const po = p.po ?? opts.padding;
          const inS = Math.min(first.s, Math.max(first.s - pi, prev ? prev.e : 0, 0));
          const outS = Math.max(last.e, Math.min(last.e + po, next ? next.s : clip.duration));
          return { in: r3(inS), out: r3(Math.min(outS, clip.duration)) };
        }

        const textOf = (c, a, b) =>
          clips[c].words
            .slice(a, b + 1)
            .map((w) => w.t)
            .join(" ");

        function rebuildProgram() {
          let t = 0;
          program = picks().map((p) => {
            const { in: inS, out } = pickTimes(p);
            const item = { entry: p, start: r3(t), in: inS, out, dur: r3(out - inS) };
            t += item.dur;
            return item;
          });
        }
        const programDuration = () => program.reduce((t, x) => t + x.dur, 0);
        const pendingDuration = () =>
          pendingSuggestions().reduce((t, x) => {
            const s = suggById.get(x.sid);
            const { in: inS, out } = pickTimes(s);
            return t + out - inS;
          }, 0);

        // Per-word state for the transcript: which entry covers each word.
        function coverage() {
          const cov = clips.map((c) => new Array(c.words.length).fill(null));
          for (const x of seq) {
            const r = entryRange(x);
            for (let i = r.a; i <= r.b; i++) cov[r.c][i] = x;
          }
          return cov;
        }

        // ---- Edits -------------------------------------------------------------------------
        function newPickId() {
          return `p${nextPick++}`;
        }

        // Adds words a..b of clip c to the cut. Picks and pending suggestions they touch or overlap merge into one pick
        // in the place of the first of them (a suggestion that merges is taken, as changed). A new pick goes after the
        // selected entry, else at the end.
        function addRange(c, a, b) {
          const touched = seq.filter((x) => {
            const r = entryRange(x);
            return r.c === c && r.a <= b + 1 && r.b >= a - 1;
          });
          if (touched.length === 1 && isPick(touched[0]) && touched[0].a <= a && touched[0].b >= b)
            return { changed: false, pick: touched[0] };
          let lo = a;
          let hi = b;
          for (const x of touched) {
            const r = entryRange(x);
            lo = Math.min(lo, r.a);
            hi = Math.max(hi, r.b);
          }
          const first = touched[0] ?? null;
          const base = first ? (isPick(first) ? first : null) : null;
          const sg = touched.map((x) => (isPick(x) ? x.sg : x.sid)).find(Boolean) ?? null;
          const note = touched
            .map((x) => (isPick(x) ? x.note : suggById.get(x.sid).note))
            .filter(Boolean)
            .join(" / ");
          const pick = {
            kind: "pick",
            id: base ? base.id : newPickId(),
            c,
            a: lo,
            b: hi,
            pi: base ? base.pi : null,
            po: base ? base.po : null,
            note,
            sg,
          };
          if (first) {
            const at = seq.indexOf(first);
            seq = seq.filter((x) => !touched.includes(x));
            seq.splice(at, 0, pick);
          } else {
            const after = selId ? findEntry(selId) : null;
            const at = after ? seq.indexOf(after) + 1 : seq.length;
            seq.splice(at, 0, pick);
          }
          return { changed: true, pick };
        }

        // Removes words a..b of clip c from the cut: picks shrink or split; a pending suggestion it overlaps is taken
        // without those words (changed), or rejected when nothing is left.
        function removeRange(c, a, b) {
          let changed = false;
          const out = [];
          for (const x of seq) {
            const r = entryRange(x);
            if (r.c !== c || r.b < a || r.a > b) {
              out.push(x);
              continue;
            }
            changed = true;
            const base = isPick(x)
              ? x
              : {
                  kind: "pick",
                  id: null,
                  c,
                  a: r.a,
                  b: r.b,
                  pi: null,
                  po: null,
                  note: suggById.get(x.sid).note,
                  sg: x.sid,
                };
            const parts = [];
            if (r.a < a) parts.push({ ...base, a: r.a, b: a - 1 });
            if (r.b > b) parts.push({ ...base, a: b + 1, b: r.b });
            parts.forEach((p, k) => {
              p.id = k === 0 && base.id ? base.id : newPickId();
              out.push(p);
            });
          }
          if (changed) seq = out;
          return changed;
        }

        function accept(sids) {
          const want = new Set(sids);
          let n = 0;
          seq = seq.map((x) => {
            if (isPick(x) || !want.has(x.sid)) return x;
            const s = suggById.get(x.sid);
            n++;
            return {
              kind: "pick",
              id: newPickId(),
              c: s.c,
              a: s.a,
              b: s.b,
              pi: null,
              po: null,
              note: s.note,
              sg: s.id,
            };
          });
          return n;
        }

        function reject(sids) {
          const want = new Set(sids);
          const before = seq.length;
          seq = seq.filter((x) => isPick(x) || !want.has(x.sid));
          return before - seq.length;
        }

        function moveEntry(id, to) {
          const x = findEntry(id);
          if (!x) return false;
          const from = seq.indexOf(x);
          const at = clamp(to, 0, seq.length - 1);
          if (at === from) return false;
          seq.splice(from, 1);
          seq.splice(at, 0, x);
          return true;
        }

        // One user edit: re-render, save, re-sequence the player and push one undo step.
        function afterEdit(label) {
          refreshAll();
          historyLink.commit(label);
          if (label) say(label);
        }

        function say(text) {
          ui.status.textContent = text;
        }

        // ---- Edit commands (keys, buttons) -----------------------------------------------
        function currentRange() {
          if (selection) return selection;
          return { c: cursor.c, a: cursor.i, b: cursor.i };
        }

        function cmdAdd() {
          if (!clips[cursor.c]?.words.length) return say("No words here to pick");
          const r = currentRange();
          const { changed, pick } = addRange(r.c, r.a, r.b);
          selId = pick.id;
          clearSelection();
          if (!changed) {
            refreshAll();
            return say("Already picked");
          }
          afterEdit(`Pick “${clipText(pick.c, pick.a, pick.b, 4)}”`);
        }

        function cmdRemove() {
          if (!clips[cursor.c]?.words.length) return;
          if (!selection) {
            const x = selId ? findEntry(selId) : null;
            if (x) return cmdDeleteEntry(x);
          }
          const r = currentRange();
          clearSelection();
          if (!removeRange(r.c, r.a, r.b)) {
            refreshAll();
            return say("Nothing picked there");
          }
          if (selId && !findEntry(selId)) selId = null;
          afterEdit(`Remove ${plural(r.b - r.a + 1, "word")}`);
        }

        function cmdDeleteEntry(x) {
          if (isPick(x)) {
            seq = seq.filter((y) => y !== x);
            selId = null;
            afterEdit(`Delete pick ${pickNumber(x)}`);
          } else {
            reject([x.sid]);
            selId = null;
            afterEdit(`Reject ${x.sid}`);
          }
        }

        // The suggestion a key acts on: the selected entry, else the one under the cursor.
        function targetSuggestion() {
          const x = selId ? findEntry(selId) : null;
          if (x && !isPick(x)) return x.sid;
          const cov = coverage();
          const under = cov[cursor.c]?.[cursor.i];
          if (under && !isPick(under)) return under.sid;
          return null;
        }

        function cmdAccept() {
          const sid = targetSuggestion();
          if (!sid)
            return say("No pending suggestion here: select one in Picks or put the cursor on it");
          accept([sid]);
          const p = seq.find((x) => isPick(x) && x.sg === sid);
          selId = p.id;
          afterEdit(`Accept ${sid}`);
        }

        function cmdAcceptAll() {
          const ids = pendingSuggestions().map((x) => x.sid);
          if (!ids.length) return say("No pending suggestions");
          accept(ids);
          afterEdit(`Accept ${plural(ids.length, "suggestion")}`);
        }

        function cmdReject() {
          const sid = targetSuggestion();
          if (!sid) return say("No pending suggestion here");
          reject([sid]);
          if (selId === `g:${sid}`) selId = null;
          afterEdit(`Reject ${sid}`);
        }

        // [ / ] grow the selected pick by a word at the start / end; { / } shrink it.
        function cmdNudge(edge, dir) {
          const x = selId ? findEntry(selId) : null;
          if (!x || !isPick(x))
            return say("Select a pick first (click it in the transcript or Picks)");
          const clip = clips[x.c];
          if (edge === "start") {
            if (dir < 0) {
              if (x.a === 0) return say("The pick already starts at the first word");
              addRange(x.c, x.a - 1, x.a - 1);
            } else {
              if (x.a === x.b) return say("A pick keeps at least one word");
              removeRange(x.c, x.a, x.a);
            }
          } else if (dir > 0) {
            if (x.b === clip.words.length - 1) return say("The pick already ends at the last word");
            addRange(x.c, x.b + 1, x.b + 1);
          } else {
            if (x.a === x.b) return say("A pick keeps at least one word");
            removeRange(x.c, x.b, x.b);
          }
          const label =
            edge === "start"
              ? dir < 0
                ? "Extend start"
                : "Trim start"
              : dir > 0
                ? "Extend end"
                : "Trim end";
          if (!findEntry(selId)) selId = null;
          afterEdit(label);
        }

        function cmdMove(dir) {
          const x = selId ? findEntry(selId) : null;
          if (!x) return say("Select an entry in Picks to move it");
          if (moveEntry(selId, seq.indexOf(x) + dir)) afterEdit(dir < 0 ? "Move up" : "Move down");
        }

        function cmdSelectSentence() {
          const clip = clips[cursor.c];
          if (!clip || !clip.words.length) return;
          const w = clip.words;
          let a = cursor.i;
          while (a > 0 && !w[a - 1].sentEnd) a--;
          let b = cursor.i;
          while (b < w.length - 1 && !w[b].sentEnd) b++;
          setSelection(cursor.c, a, b);
        }

        function pickNumber(x) {
          return picks().indexOf(x) + 1;
        }

        function clipText(c, a, b, max) {
          const ws = clips[c].words.slice(a, b + 1).map((w) => w.t);
          return ws.length > max ? `${ws.slice(0, max).join(" ")}…` : ws.join(" ");
        }

        // ---- Selection and cursor ----------------------------------------------------------
        function setSelection(c, a, b) {
          selection = { c, a: Math.min(a, b), b: Math.max(a, b) };
          anchor = { c, i: selection.a };
          cursor = { c, i: selection.b };
          renderWords();
          renderSelInfo();
        }
        function clearSelection() {
          selection = null;
          anchor = null;
          renderSelInfo();
        }
        function moveCursor(c, i, extend) {
          const clip = clips[c];
          if (!clip || !clip.words.length) return;
          i = clamp(i, 0, clip.words.length - 1);
          if (extend) {
            if (!anchor || anchor.c !== c || !selection)
              anchor = { c, i: cursor.c === c ? cursor.i : i };
            selection = { c, a: Math.min(anchor.i, i), b: Math.max(anchor.i, i) };
          } else {
            selection = null;
            anchor = null;
          }
          cursor = { c, i };
          renderWords();
          renderSelInfo();
          scrollWordIntoView(c, i);
        }
        function stepCursor(delta, extend) {
          let { c, i } = cursor;
          i += delta;
          if (!extend) {
            while (i < 0 && c > 0) {
              c--;
              i += clips[c].words.length;
            }
            while (c < clips.length - 1 && i >= clips[c].words.length) {
              i -= clips[c].words.length;
              c++;
            }
          }
          moveCursor(c, i, extend);
        }
        function stepParagraph(dir, extend) {
          const clip = clips[cursor.c];
          if (!clip || !clip.words.length) return;
          const seg = clip.words[cursor.i].seg + dir;
          if (seg >= 0 && seg < clip.segs.length)
            return moveCursor(cursor.c, clip.segs[seg].a, extend);
          if (extend) return moveCursor(cursor.c, dir < 0 ? 0 : clip.words.length - 1, true);
          let c = cursor.c + dir;
          while (c >= 0 && c < clips.length && !clips[c].words.length) c += dir;
          if (c < 0 || c >= clips.length) return;
          const target = clips[c];
          moveCursor(c, dir < 0 ? target.segs[target.segs.length - 1].a : 0, false);
        }
        function stepSentence(dir, extend) {
          const w = clips[cursor.c]?.words ?? [];
          if (!w.length) return;
          let i = cursor.i;
          if (dir < 0) {
            i = Math.max(0, i - 1);
            while (i > 0 && !w[i - 1].sentEnd) i--;
          } else {
            while (i < w.length - 1 && !w[i].sentEnd) i++;
            i = Math.min(w.length - 1, i + 1);
          }
          moveCursor(cursor.c, i, extend);
        }

        function renderSelInfo() {
          if (!selection) {
            const clip = clips[cursor.c];
            const w = clip?.words[cursor.i];
            ui.selInfo.textContent = w ? `${clip.label} · ${fmtT(w.s)}` : "";
            return;
          }
          const clip = clips[selection.c];
          const s = clip.words[selection.a].s;
          const e = clip.words[selection.b].e;
          ui.selInfo.textContent = `${plural(selection.b - selection.a + 1, "word")} · ${(e - s).toFixed(1)} s · ${clip.label} ${fmtT(s)}  ↵ pick  ⌫ remove`;
        }

        // ---- Transcript rendering ------------------------------------------------------------
        function renderTranscript() {
          const root = ui.doc;
          root.replaceChildren();
          const frag = document.createDocumentFragment();
          let silent = null; // the open group of consecutive clips without speech
          clips.forEach((clip, c) => {
            wordClass[c] = [];
            wordEls[c] = [];
            paraEls[c] = [];
            if (!clip.words.length) {
              if (!silent) {
                silent = { box: el("section", "silent"), clips: [] };
                silent.head = el("div", "silent-head");
                silent.list = el("div", "silent-list");
                silent.box.append(silent.head, silent.list);
                frag.append(silent.box);
              }
              silent.clips.push(clip);
              const chip = el("button", "silent-clip");
              chip.type = "button";
              chip.dataset.c = String(c);
              chip.title = clip.media
                ? `${clip.source}\nNo speech in the transcript. Click to play it in Source.`
                : `${clip.source}\nNo speech, and no media attached.`;
              chip.append(
                el("span", null, clip.label),
                el("span", "mono muted", fmtLen(clip.duration)),
              );
              silent.list.append(chip);
              clipEls[c] = chip;
              const n = silent.clips.length;
              silent.head.textContent = `No speech · ${plural(n, "clip")} · ${fmtLen(silent.clips.reduce((t, k) => t + k.duration, 0))}`;
              return;
            }
            silent = null;
            const sec = el("section", "tclip");
            sec.dataset.c = String(c);
            const head = el("div", "tclip-head");
            head.append(
              el("span", "clip-name", clip.label),
              el("span", "chip mono", fmtLen(clip.duration)),
              el("span", "src", clip.source),
            );
            sec.append(head);
            if (!clip.media) {
              sec.append(
                el(
                  "div",
                  "tclip-nomedia",
                  "Media not attached: this clip edits and exports, but does not preview.",
                ),
              );
            }
            const spans = [];
            const paras = [];
            for (const p of clip.segs) {
              const para = el("div", "para");
              const ts = el("span", "ts", fmtT(p.s));
              ts.dataset.c = String(c);
              ts.dataset.i = String(p.a);
              ts.title = "Play from here in Source";
              const words = el("div", "words");
              for (let i = p.a; i <= p.b; i++) {
                const sp = el("span", "w", clip.words[i].t);
                sp.dataset.c = String(c);
                sp.dataset.i = String(i);
                spans[i] = sp;
                words.append(sp);
                if (i < p.b) words.append(" ");
              }
              para.append(ts, words);
              paras.push(para);
              sec.append(para);
            }
            wordEls[c] = spans;
            paraEls[c] = paras;
            clipEls[c] = sec;
            wordClass[c] = new Array(clip.words.length).fill("w");
            frag.append(sec);
          });
          if (!clips.length)
            frag.append(
              el(
                "div",
                "empty",
                "No transcripts attached. Attach each clip with its transcript JSON (media_prepare writes them).",
              ),
            );
          root.append(frag);
        }

        // Updates word classes where they changed: picks, suggestions, selection, cursor, playback, search hits.
        function renderWords() {
          const cov = coverage();
          const selEntry = selId ? findEntry(selId) : null;
          const hitSet = new Set();
          for (const h of hits) for (let i = h.a; i <= h.b; i++) hitSet.add(`${h.c}:${i}`);
          clips.forEach((clip, c) => {
            const spans = wordEls[c];
            const last = wordClass[c];
            const segOn = new Array(clip.segs.length).fill(false);
            let clipOn = false;
            for (let i = 0; i < clip.words.length; i++) {
              const x = cov[c][i];
              let cls = "w";
              if (x) {
                cls += isPick(x) ? " p" : " g";
                if (cov[c][i + 1] !== x) cls += " pe";
                if (x === selEntry) cls += " k";
                segOn[clip.words[i].seg] = true;
                clipOn = true;
              }
              if (selection && selection.c === c && i >= selection.a && i <= selection.b) {
                cls += " sel";
                if (i === selection.b) cls += " se";
              }
              if (hitSet.has(`${c}:${i}`)) cls += " hit";
              if (cursor.c === c && cursor.i === i) cls += " cur";
              if (nowWord && nowWord.c === c && nowWord.i === i) cls += " now";
              if (cls !== last[i]) {
                spans[i].className = cls;
                last[i] = cls;
              }
            }
            paraEls[c].forEach((p, k) => p.classList.toggle("off", !segOn[k]));
            if (clip.words.length) clipEls[c].classList.toggle("off", !clipOn);
          });
        }

        function scrollWordIntoView(c, i, center) {
          const sp = wordEls[c]?.[i];
          if (!sp) return;
          const box = ui.doc.getBoundingClientRect();
          const r = sp.getBoundingClientRect();
          const top = box.top + 34; // below the sticky clip header
          if (r.top < top || r.bottom > box.bottom - 8) {
            const delta = center
              ? r.top - (box.top + box.height / 2)
              : r.top < top
                ? r.top - top - 8
                : r.bottom - box.bottom + 24;
            ui.doc.scrollTop += delta;
          }
        }

        // ---- Library (left) ------------------------------------------------------------------
        function renderLibrary() {
          if (ui.search.value.trim()) return renderResults();
          ui.searchMeta.hidden = true;
          const list = ui.libList;
          list.replaceChildren();
          const counts = clips.map(() => ({ p: 0, g: 0 }));
          for (const x of seq) counts[entryRange(x).c][isPick(x) ? "p" : "g"] += 1;
          clips.forEach((clip, c) => {
            const row = el("button", clip.words.length ? "clip-row" : "clip-row silent-row");
            row.type = "button";
            row.setAttribute("role", "listitem");
            row.dataset.c = String(c);
            row.setAttribute("aria-current", String(cursor.c === c));
            row.title = `${clip.source}\n${clip.transcript}`;
            const sub = el("div", "clip-sub");
            sub.append(
              el("span", null, clip.words.length ? plural(clip.words.length, "word") : "No speech"),
            );
            if (counts[c].p) sub.append(el("span", "chip pick", plural(counts[c].p, "pick")));
            if (counts[c].g) sub.append(el("span", "chip sugg", `${counts[c].g} suggested`));
            if (!clip.media) sub.append(el("span", "chip warn", "no media"));
            const cover = el("div", "cover");
            for (const x of seq) {
              const r = entryRange(x);
              if (r.c !== c) continue;
              const t = pickTimes(r);
              const i = el("i", isPick(x) ? null : "g");
              i.style.left = `${(100 * t.in) / clip.duration}%`;
              i.style.width = `${Math.max(1.5, (100 * (t.out - t.in)) / clip.duration)}%`;
              cover.append(i);
            }
            row.append(
              el("span", "clip-name", clip.label),
              el("span", "clip-dur", fmtLen(clip.duration)),
              sub,
              cover,
            );
            list.append(row);
          });
          const total = clips.reduce((t, c) => t + c.duration, 0);
          const words = clips.reduce((t, c) => t + c.words.length, 0);
          const silent = clips.filter((c) => !c.words.length).length;
